<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ฝึกตัดสินใจหน้าเทรด — วิถี Survivor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---- palette: matches survivor.html (main page is the standard) ---- */
:root{
  --bg:#E9EDF0; --surface:#FFFFFF; --sunk:#DFE5EA; --ink:#16212B; --ink2:#586673; --line:#C9D2D9;
  --up:#0B7F57; --down:#B4302A; --flat:#8A6200; --accent:#2B4C7E; --accentInk:#fff;
  --upSoft:#DCF0E6; --downSoft:#F7DEDB; --flatSoft:#F5EBC8;
  --zone:rgba(43,76,126,.15);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* dark: same tokens as survivor.html (bg/surface/ink/muted/line/soft + go/wait/exit) */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F171E; --surface:#172129; --sunk:#1C2832; --ink:#E3E9EE; --ink2:#93A1AD; --line:#2A3743;
    --up:#3CC48F; --down:#F0675C; --flat:#E2B44B; --accent:#8DB2EA; --accentInk:#0F171E;
    --upSoft:#12312A; --downSoft:#3E1D1B; --flatSoft:#3A3013;
    --zone:rgba(141,178,234,.2);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F171E; --surface:#172129; --sunk:#1C2832; --ink:#E3E9EE; --ink2:#93A1AD; --line:#2A3743;
  --up:#3CC48F; --down:#F0675C; --flat:#E2B44B; --accent:#8DB2EA; --accentInk:#0F171E;
  --upSoft:#12312A; --downSoft:#3E1D1B; --flatSoft:#3A3013;
  --zone:rgba(141,178,234,.2);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{font-size:16px;scroll-padding-top:env(safe-area-inset-top,0px)}
@media (min-width:900px){html{font-size:17px}}
@media (min-width:1400px){html{font-size:18px}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai","Sukhumvit Set","Thonburi","Noto Sans Thai",system-ui,sans-serif;font-size:1rem;line-height:1.55;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1560px;margin:0 auto;padding:16px 16px 40px}
@media (min-width:900px){.wrap{padding:20px 28px 48px}}
@media (min-width:1400px){.wrap{padding-left:40px;padding-right:40px}}
header{display:flex;align-items:center;gap:.6rem;padding:.4rem 0 .75rem}
header h1{font-size:1.2rem;font-weight:700;margin:0;line-height:1.25}
header h1 small{display:block;font-size:.8rem;font-weight:400;color:var(--ink2)}
.spacer{flex:1}
.iconbtn{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:.6rem;padding:.45rem .7rem;font:inherit;font-size:.88rem;cursor:pointer;min-height:2.5rem}
.iconbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{display:flex;flex-wrap:wrap;align-items:baseline;gap:.25rem .6rem;margin:.25rem 0 .5rem}
.clock{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1}
.stageName{flex:1 1 auto;color:var(--ink2);font-size:.92rem}
.ctx{display:flex;flex-wrap:wrap;gap:.375rem;margin:0 0 .6rem;padding:0;list-style:none}
.ctx li{background:var(--surface);border:1px solid var(--line);border-radius:.5rem;padding:.25rem .55rem;font-size:.86rem;max-width:100%;overflow-wrap:anywhere}
.ctx li b{font-weight:600}
.note{font-size:.9rem;background:var(--sunk);border-radius:.5rem;padding:.5rem .65rem;margin:0 0 .6rem}
.quote{display:flex;gap:.5rem .9rem;align-items:flex-end;flex-wrap:wrap;margin:0 0 .6rem;font-variant-numeric:tabular-nums}
.quote>div{min-width:0}
.quote .px{display:inline-block;font-size:clamp(1.2rem,5.6vw,1.5rem);font-weight:700;padding:.1rem .55rem;border-radius:.5rem;white-space:nowrap}
.quote .lbl{font-size:.82rem;color:var(--ink2);display:block}
.px.up{color:var(--up);background:var(--upSoft)} .px.down{color:var(--down);background:var(--downSoft)} .px.flat{color:var(--flat);background:var(--flatSoft)}
.px.plain{color:var(--ink);padding-left:0}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:.75rem;padding:.5rem .45rem .35rem;margin:0 0 .5rem;position:relative}
.chart.primary{border-color:var(--ink2)}
.chart .cap{font-size:.78rem;color:var(--ink2);padding:0 .25rem;display:flex;justify-content:space-between;gap:.5rem}
.chart svg{display:block;width:100%;height:auto;touch-action:manipulation;font-variant-numeric:tabular-nums}
.chart svg text{font-family:inherit}
.chart.tapping{outline:2px dashed var(--accent);outline-offset:-2px;cursor:crosshair}
.sim{font-size:.75rem;color:var(--ink2);text-align:center;margin:.125rem 0 .75rem}
.timer{height:.3rem;background:var(--sunk);border-radius:.2rem;overflow:hidden;margin:0 0 .6rem}
.timer i{display:block;height:100%;background:var(--accent);width:100%;transition:width linear}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.answers button{min-height:3.6rem;border-radius:.75rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:1rem;cursor:pointer;padding:.5rem .6rem;line-height:1.3;overflow-wrap:anywhere}
.answers button:active{transform:scale(.98)}
.answers button.pick{border-color:var(--accent);background:var(--zone)}
.answers button.right{border-color:var(--up);background:var(--upSoft)}
.answers button.wrong{border-color:var(--down);background:var(--downSoft)}
.answers button:disabled{cursor:default}
.answers.n3{grid-template-columns:1fr 1fr 1fr}
@media (max-width:440px){.answers.n3{grid-template-columns:1fr 1fr}.answers.n3 button:last-child{grid-column:span 2}.answers button{font-size:.95rem}}
.stopbar{display:none;margin:.6rem 0 0;background:var(--surface);border:1.5px solid var(--accent);border-radius:.75rem;padding:.6rem}
.stopbar.on{display:block}
.stopbar p{margin:0 0 .5rem;font-size:.92rem}
.stoprow{display:flex;gap:.5rem;align-items:center}
.stoprow .val{flex:1;min-width:0;text-align:center;font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.stoprow button{min-width:3.2rem;min-height:2.9rem;border-radius:.6rem;border:1px solid var(--line);background:var(--sunk);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.stoprow button.go{background:var(--accent);color:var(--accentInk);border-color:var(--accent);min-width:6.2rem}
.stoprow button:disabled{opacity:.45}
.fb{display:none;margin:.75rem 0 0;border-radius:.9rem;padding:.9rem;background:var(--surface);border:1px solid var(--line)}
.fb.on{display:block}
.fb .verdict{font-size:1.25rem;font-weight:700;margin:0 0 .25rem}
.fb.ok .verdict{color:var(--up)} .fb.no .verdict{color:var(--down)}
.fb .sub{color:var(--ink2);font-size:.9rem;margin:0 0 .6rem}
.fb dl{margin:0}
.fb dt{font-size:.8rem;color:var(--ink2);margin-top:.6rem}
.fb dd{margin:.125rem 0 0}
.fb blockquote{margin:.6rem 0 0;padding:.5rem .75rem;border-left:3px solid var(--accent);background:var(--sunk);border-radius:0 .5rem .5rem 0;font-size:.98rem}
.tag{display:inline-block;font-size:.8rem;padding:.125rem .5rem;border-radius:.375rem;background:var(--flatSoft);color:var(--ink);margin-top:.5rem}
.next{margin-top:.9rem;width:100%;min-height:3.4rem;border-radius:.75rem;border:0;background:var(--ink);color:var(--surface);font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
.score{white-space:nowrap;font-size:.85rem;color:var(--ink2);font-variant-numeric:tabular-nums}
dialog{border:1px solid var(--line);border-radius:.9rem;background:var(--surface);color:var(--ink);max-width:36rem;width:calc(100% - 1.5rem);padding:1rem}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{font-size:1.05rem;margin:0 0 .6rem}
.statrow{display:grid;grid-template-columns:1fr 4rem 3.2rem;gap:.5rem;align-items:center;font-size:.9rem;padding:.3rem 0;border-bottom:1px solid var(--line)}
.statrow .bar{height:.375rem;background:var(--sunk);border-radius:.2rem;overflow:hidden}
.statrow .bar i{display:block;height:100%;background:var(--up)}
.statrow .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.grouph{font-weight:600;margin:.75rem 0 .125rem;font-size:.92rem}
.dlgbtns{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.9rem}
.saveinfo{font-size:.78rem;color:var(--ink2);margin-top:.5rem}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details .statrow{padding-left:.75rem}
details summary.statrow{padding-left:0}
.topics{display:flex;flex-wrap:wrap;gap:.4rem;padding:0 0 .75rem;margin:0 0 .25rem;border-bottom:1px solid var(--line)}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:.35rem .75rem;font:inherit;font-size:.92rem;cursor:pointer;white-space:nowrap;min-height:2.3rem}
.chip small{margin-left:.35rem;color:var(--ink2);font-size:.78em}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:var(--surface);opacity:.75}
.topicTag{margin:0 0 .125rem;font-size:.82rem;color:var(--accent);font-weight:600}
.topicTag:empty{display:none}
.dim{color:var(--ink2)}
.qline{font-weight:600;font-size:1.02rem;margin:-.125rem 0 .5rem}
.qline:empty{display:none}
/* wide screens: charts left, question + answers right */
@media (min-width:980px){
  main#q{display:grid;grid-template-columns:minmax(0,46rem) minmax(20rem,1fr);grid-template-areas:"charts info" "charts act";grid-template-rows:auto 1fr;column-gap:1.4rem}
  main#q .info{grid-area:info} main#q .charts{grid-area:charts} main#q .act{grid-area:act}
  .charts{position:sticky;top:.5rem;align-self:start}
}
/* embed (?embed=1 inside survivor.html): full iframe width, no side padding */
html.embed body{background:transparent}
html.embed .wrap{max-width:none;padding:0 0 1.5rem}
html.embed header{padding-top:0}
html.embed header h1{display:none}
.answers.list{grid-template-columns:1fr 1fr;align-items:stretch}
.answers.list button{text-align:left;min-height:4.2rem;font-weight:500;padding:.7rem .8rem;font-size:.95rem;line-height:1.35;display:flex;align-items:center}
.answers.list button:last-child:nth-child(odd){grid-column:1 / -1}
@media (max-width:440px){.answers.list button{font-size:.9rem;padding:.6rem .6rem;min-height:4.6rem}}
.diffs{border-bottom:0;padding-bottom:.4rem;align-items:center}
.diffs .dlabel{font-size:.85rem;color:var(--ink2);margin-right:.2rem}
.whys{list-style:none;margin:.4rem 0 0;padding:0;display:grid;gap:.4rem}
.whys li{display:flex;gap:.55rem;align-items:flex-start;padding:.55rem .65rem;border-radius:.6rem;border:1px solid var(--line);background:var(--bg)}
.whys li.ok{border-color:var(--up);background:var(--upSoft)}
.whys li.no.me{border-color:var(--down);background:var(--downSoft)}
.whys .mk{font-weight:700;width:1.1rem;flex:none;text-align:center}
.whys li.ok .mk{color:var(--up)} .whys li.no .mk{color:var(--down)}
.whys p{margin:.15rem 0 0;font-size:.92rem;color:var(--ink)}
.whys .mine{font-size:.75rem;color:var(--ink2);font-weight:500}
.chainres{font-weight:600;margin:.8rem 0 0}
.chainres.ok{color:var(--up)} .chainres.no{color:var(--down)}
@media (prefers-reduced-motion:reduce){.timer i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ฝึกตัดสินใจหน้าเทรด<small>แบบฝึกหัดวิถี Survivor · สุ่มสถานการณ์และกราฟจากตำรา</small></h1>
    <span class="spacer"></span>
    <button class="iconbtn" id="timerBtn" aria-pressed="false" title="จับเวลา 10 วินาที">⏱ 10 วิ</button>
    <button class="iconbtn" id="statsBtn">สถิติ</button>
  </header>
  <nav class="topics" id="topics" aria-label="เลือกหมวด"></nav>

  <main id="q">
   <div class="info">
    <p class="topicTag" id="topicTag"></p>
    <div class="stage"><span class="clock" id="clock"></span><span class="stageName" id="stageName"></span><span class="spacer"></span><span class="score" id="score"></span></div>
    <p class="qline" id="qline"></p>
    <ul class="ctx" id="ctx"></ul>
    <p class="note" id="note" hidden></p>
    <div class="quote" id="quote" hidden></div>
   </div>
   <div class="charts">
    <div class="chart" id="dayBox"><div class="cap"><span id="dayT">TF Day</span><span id="dayCap"></span></div><svg id="daySvg" viewBox="0 0 360 210" role="img" aria-label="กราฟแท่งเทียนรายวัน"></svg></div>
    <div class="chart" id="m5Box"><div class="cap"><span id="m5T">TF 5 นาที</span><span id="m5Cap"></span></div><svg id="m5Svg" viewBox="0 0 360 200" role="img" aria-label="กราฟ 5 นาที"></svg></div>
    <p class="sim">กราฟจำลองเพื่อฝึกหลักคิด ไม่ใช่ข้อมูลหุ้นจริง · ไม่ใช่สัญญาณซื้อขาย</p>
   </div>
   <div class="act">
    <div class="timer" id="timer" hidden><i id="timerFill"></i></div>
    <div class="answers" id="answers"></div>
    <div class="stopbar" id="stopbar">
      <p>แตะกราฟ 5 นาทีตรงจุดที่จะวาง Stop แล้วปรับทีละช่อง</p>
      <div class="stoprow">
        <button id="stDown" aria-label="ลง 1 ช่อง">−1</button>
        <span class="val" id="stVal">แตะกราฟ</span>
        <button id="stUp" aria-label="ขึ้น 1 ช่อง">+1</button>
        <button class="go" id="stGo" disabled>ยืนยัน Stop</button>
      </div>
    </div>
    <section class="fb" id="fb" aria-live="polite"></section>
   </div>
  </main>
</div>

<dialog id="statsDlg">
  <h2>สถิติ</h2>
  <div id="statsBody"></div>
  <p class="saveinfo" id="saveInfo"></p>
  <div class="dlgbtns"><button class="iconbtn" id="resetBtn">ล้างสถิติ</button><button class="iconbtn" id="closeDlg">ปิด</button></div>
</dialog>

<script>
const BANK = {"meta": {"name": "Survivor practice bank", "version": "3 (ตำรา v47 + รอเข้าตำรา P1–P7, K1)", "count": 139, "how_to_use": "แต่ละข้อมี context (การ์ดบริบท) + chart.pattern (ให้วาดตาม patterns) + options (ปุ่มตัวเลือก มี why อธิบายทุกตัว) · type=chain คือโจทย์ต่อเนื่องหลายขั้น แสดงทีละ step · source='รอเข้าตำรา' ให้ติดป้าย 'ยังไม่อยู่ในตำรา — มาจากไฟล์เสียงคลาส' · difficulty 1=ง่าย 2=กลาง 3=ยาก", "patterns": {"sideways_dry": "ออกข้างกรอบแคบ 3–6 แท่ง วอลุ่มลดลงเป็นขั้นบันได แท่งสุดท้ายเล็กสุด", "doji_dry_support": "แท่งเล็ก/โดจิ บนเส้นแนวรับ วอลุ่มต่ำสุดในรอบ 10 แท่ง", "big_white_first": "ฐานล่างยาว วอลุ่มแห้ง → Big White แท่งแรกทะลุฐาน วอลุ่มพีค (แท่งขวาสุด)", "big_white_first_upper_wick": "Big White แท่งแรกจากฐานล่าง ปิดมีไส้บนยาวราว 1/3 ของแท่ง วอลุ่มพีค", "big_white_second": "Big White แท่งแรก → พัก 1–2 แท่งเล็ก → แท่งที่สองเปิดโดดต่อ (แท่งขวาสุด)", "big_white_third_climax": "ขึ้นมา 3 แท่งเขียวยาวติด แท่งที่สามไส้บนยาว วอลุ่มพีคสูงสุดในรอบ", "n_leg_pullback": "Big White 1 แท่ง → ย่อยืนแท่งเล็ก 2 แท่งเหนือแนวเบรค วอลุ่มลดเหลือราวครึ่ง/หนึ่งในสาม", "n_leg_too_long": "Big White → ออกข้าง 5–6 แท่ง วอลุ่มไม่ลด แท่งเริ่มหลุดกรอบล่าง", "top_zone_third_base": "ขาขึ้นยาว มีการพักตัวโซนบน 2 ครั้งแล้ว กำลังพักครั้งที่ 3 ราคาตึง วอลุ่มไม่ลด", "long_base_bottom": "ออกข้างโซนล่างยาวมาก (20+ แท่ง) วอลุ่มแทบหาย ยังไม่มีแท่งเขียวยาว", "gap_go": "TF 5 นาที: เปิดกระโดดสูง 10:00 แล้ววิ่งขึ้นต่อทันที วอลุ่มทะลักนาทีแรก", "gap_dip": "TF 5 นาที: เปิดโดด → ย่อลงเทสราคาปิดวันก่อน ทิ้งไส้ล่าง → ยืนออกข้าง วอลุ่มแห้งช่วง 10:15–10:30", "gap_console": "TF 5 นาที: เปิดโดดแล้วยืนออกข้างแคบบนโซนสูง วอลุ่มเหือดลงเรียบ", "gap_fade": "TF 5 นาที: เปิดโดดสูงสุดตอน 10:00 แล้วโรยลงทั้งวัน ปิดใกล้ Low", "gap_flat_offer": "TF 5 นาที: เปิดโดดแล้วแท่งแบนไม่วิ่ง (เปิดแปะ) วอลุ่มสูงแต่ราคาไม่ไป", "morning_panic_reclaim": "TF 5 นาที: เปิดกดลึกช่วงเช้า วอลุ่มพีค → 2–3 แท่งทุบเล็กลง → ม้วนกลับยืนเหนือแนวรับเดิม", "evening_dump": "TF 5 นาที: ทั้งวันนิ่ง → หลัง 16:00 ทุบแรงต่อเนื่อง ปิดใกล้ Low", "ove /* ---------- utils ---------- */
const R = Math.random;
const ri = (a,b)=>a+Math.floor(R()*(b-a+1));
const pick = a=>Array.isArray(a)?a[Math.floor(R()*a.length)]:a;

const BANDS = [{lo:125,hi:245,t:0.02,dec:2},{lo:104,hi:192,t:0.05,dec:2},{lo:105,hi:240,t:0.10,dec:2},{lo:104,hi:380,t:0.25,dec:2}];

/* ---------- day history ---------- */
function buildDays(closes, volMult, baseVol){
  const days=[]; let prev = closes[0]+ri(-1,1);
  closes.forEach((c,i)=>{
    const o = prev + (R()<.25?ri(-1,1):0);
    const h = Math.max(o,c)+(R()<.55?ri(1,2):0);
    const l = Math.min(o,c)-(R()<.55?ri(1,2):0);
    days.push({o,h,l,c,v:baseVol*(volMult[i]||1)*(0.75+R()*0.5)});
    prev=c;
  });
  return days;
}
function walk(points,n,noise){
  const out=[];
  for(let i=0;i<n;i++){
    let j=0; while(j<points.length-2 && points[j+1][0]<=i) j++;
    const [x0,y0]=points[j],[x1,y1]=points[j+1];
    const t = x1===x0?0:(i-x0)/(x1-x0);
    out.push(Math.round(y0+(y1-y0)*Math.min(1,Math.max(0,t)) + (noise?ri(-noise,noise):0)));
  }
  return out;
}
const clampArr=(a,lo,hi)=>a.map(x=>Math.max(lo,Math.min(hi,x)));
function addBW(days,size,mult,gap=0){
  const p=days[days.length-1].c, o=p+gap, c=o+size, avg=days.slice(-5).reduce((s,d)=>s+d.v,0)/5;
  days.push({o,h:c+(R()<.3?1:0),l:o-(R()<.3?1:0),c,v:avg*mult});
  return c;
}
function genHistory(kind,k0,baseVol,ho={}){

    const L=ri(16,32), rise=ri(16,32), bw=ri(4,8), p=ho.pause!=null?ho.pause:ri(1,3);
    const top=k0-3+bw;
    const st=ho.style||pick(['steady','stairs','fromBase','steep']), z=k0-3;
    let pts;
    if(st==='stairs'){ const a=ri(5,Math.max(6,L-10)); pts=[[0,z-rise],[a,z-Math.round(rise*0.45)],[a+ri(3,5),z-Math.round(rise*0.6)],[L-1,z]]; }
    else if(st==='fromBase'){ const a=ri(Math.round(L*0.4),Math.round(L*0.65)); pts=[[0,z-rise+ri(-1,2)],[a,z-rise],[L-1,z]]; }
    else if(st==='steep'){ pts=[[0,z-rise],[Math.round(L*0.3),z-Math.round(rise*0.9)],[L-1,z]]; }
    else pts=[[0,z-rise],[ri(4,L-4),z-Math.round(rise*(0.35+R()*0.3))],[L-1,z]];
    const pre=walk(pts,L,st==='steep'?1:ri(1,2));
    const pause=[]; for(let i=0;i<p;i++) pause.push(top-ri(0,2));
    closes=pre.concat([top],pause);
    vm=closes.map((_,i)=> i===L?2.2+R() : i>L?0.42+R()*0.2 : 0.85+R()*0.3);
    meta.pause=p;
  } else if(kind==='base' || kind==='bw2' || kind==='bw3'){
    const d=ri(5,12), b=ri(10,24), w=ri(1,2), from=k0+ri(12,24);

    closes[closes.length-1]=k0+pb;

    const n=x+ri(2,3);

    closes=walk([[0,k0+ri(24,34)],[ri(4,d-3),k0+ri(10,16)],[d-1,k0+1]],d,2).concat(clampArr(walk([[0,k0+1],[f-1,k0+1]],f,1),k0,k0+2));
    vm=closes.map((_,i)=> i<d?1.1:0.45+R()*0.2);
    meta.d=d; S=k0;
  } else if(kind==='range'){
    S=k0; Rr=k0+ri(8,12);
    const n=ri(26,34), pts=[[0,k0+2]]; let x=0, up=true;
    while(x<n-6){ x+=ri(4,7); pts.push([x, up?Rr-ri(0,1):S+ri(0,1)]); up=!up; }
    const end = ho.where==='top'?Rr-ri(1,2) : ho.where==='low'?S+ri(1,2) : Math.round((S+Rr)/2);
    pts.push([n-1,end]);
    closes=clampArr(walk(pts,n,1),S,Rr);
    vm=closes.map(()=>0.8+R()*0.4);
    meta.range=true;
  } else if(kind==='mini'){
    const L=ri(10,18), bh=ri(4,6), bl=ri(9,10);
    S=k0; Rr=k0+bh;
    closes=walk([[0,k0-ri(12,20)],[L-1,k0+1]],L,1).concat(clampArr(walk([[0,k0+2],[bl-1,k0+Math.round(bh/2)]],bl,2),S+1,Rr-1));
    closes[closes.length-1]=k0+Math.round(bh/2)+ri(-1,0);
    vm=closes.map((_,i)=> i<L?1:0.6+R()*0.2);

  } else if(kind==='down'){
    const n=ri(24,32);
    closes=walk([[0,k0+ri(26,36)],[ri(8,12),k0+ri(18,22)],[ri(14,18),k0+ri(12,16)],[n-1,k0]],n,1);
    vm=closes.map(()=>0.9+R()*0.4);

  const days=buildDays(closes,vm,baseVol);
  if(kind==='support'){ for(let i=meta.a;i<meta.a+meta.b;i++) days[i].l=Math.max(days[i].l,k0); days[meta.a+ri(0,1)].l=k0; days[meta.a+meta.b-1-ri(0,1)].l=k0; }

  if(kind==='trend'){ const L=closes.length-1-meta.pause; days[L].o=Math.min(days[L].o,days[L-1].c); days[L].h=Math.max(days[L].c,days[L].h-1); }
  if(kind==='bottom'){ for(let i=meta.d;i<days.length;i++){ days[i].l=Math.max(days[i].l,k0); days[i].h=Math.min(days[i].h,k0+3);} days[meta.d+ri(1,4)].l=k0; }
  if(kind==='range'){ days.forEach(d=>{ d.l=Math.max(d.l,S); d.h=Math.min(d.h,Rr); }); }
  if(kind==='mini'){ for(let i=meta.L;i<days.length;i++){ days[i].l=Math.max(days[i].l,S); days[i].h=Math.min(days[i].h,Rr);} days[meta.L+ri(1,3)].l=S; days[meta.L+ri(4,7)].h=Rr; }
  let C=closes[closes.length-1];
  if(kind==='bw2'){ C=addBW(days,ri(5,8),2.4+R(),ho.gap||0); extra=k0; }
  if(kind==='bw3'){ addBW(days,ri(5,8),2.4+R()); C=addBW(days,ri(4,7),3+R(),ri(0,1)); }
  return {days,C,S,R:Rr,extra};
}
/* ---------- intraday (54 bars: 30 morning + 24 afternoon) ---------- */
const NB=54;
const barTime = i=>{ const m = i<30 ? 600+5*i : 870+5*(i-30); return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
function intraday(o0,kps,lo,hi,volFn,noise=1){
  const lv = walk(kps,NB,noise).map(x=>Math.max(lo,Math.min(hi,x)));
  lv[0]=Math.max(lo,Math.min(hi,lv[0]));
  const bars=[]; let prev=o0;
  for(let i=0;i<NB;i++){
    const o = i===0?o0:prev, c=lv[i];
    const h = Math.min(hi, Math.max(o,c)+(R()<.3?1:0));
    const l = Math.max(lo, Math.min(o,c)-(R()<.3?1:0));
    bars.push({o,h,l,c,v:volFn(i)*(0.6+R()*0.8),t:barTime(i)});
    prev=c;
  }
  return bars;
}
function fixBars(bars){ for(let i=0;i<bars.length;i++){ const b=bars[i]; if(i>0&&!bars[i-1].y===!b.y) b.o=bars[i-1].c; b.h=Math.max(b.h,b.o,b.c); b.l=Math.min(b.l,b.o,b.c);} return bars; }
function agg(bars){ fixBars(bars); return {o:bars[0].o,c:bars[bars.length-1].c,h:Math.max(...bars.map(b=>b.h)),l:Math.min(...bars.map(b=>b.l)),v:bars.reduce((s,b)=>s+b.v,0)}; }
const avgVol=(days,n=5)=>days.slice(-n).reduce((s,d)=>s+d.v,0)/n;
function scaleVol(bars,target){ const s=bars.reduce((a,b)=>a+b.v,0); bars.forEach(b=>b.v*=target/s); }
const ush = i=> i<6?1.8 : i<30?1 : i<48?0.8 : 1.3; // normal U-shape

/* closing shapes: return {H, bars, stopRef, stopHint} — timing and size randomized within textbook conditions */
const minV=(days,n)=>Math.min(...days.slice(-n).map(d=>d.v));
const SHAPES = {
  sideways(k0,bv,kind='trend',ho){

    const kps=[[0,o]]; let x=0; while(x<46){ x+=ri(5,12); kps.push([Math.min(x,52),o+ri(-1,1)]); } kps.push([53,o+ri(0,1)]);
    const bars=intraday(o,kps,o-1,o+1,i=>i<6?1.2:i>40?0.45+R()*0.2:0.8);
    scaleVol(bars,minV(H.days,4)*(0.45+R()*0.15));
    const d=agg(bars); return {H,bars,stopRef:d.l,stopHint:'ใต้กรอบออกข้าง (Low ของวัน)'};
  },
  holdStrong(k0,bv){

    const bars=intraday(o,[[0,o],[pk,C+up],[pk+4,C+up-1],[dp,C+up-ri(1,2)],[dp+4,C+up-1],[53,C+up]],C,C+up,ush);
    bars[53].c=C+up; bars[53].h=C+up;

  reclaim(k0,bv){

    const bars=intraday(o,[[0,o],[mt,C+m],[ds,C+m-ri(0,1)],[db,C-dd],[rs,C-dd+ri(0,1)],[re,C+ri(1,m)],[53,C+ri(1,m)]],C-dd,C+m,

  },
  bigWhite(k0,bv,kind='base'){
    const H=genHistory(kind,k0,bv), C=H.C, o=C+ri(0,1), u=ri(6,11), bx=ri(44,48);
    const half=Math.round(u*(0.4+R()*0.2)), t1=ri(10,20);

    for(let i=bx;i<NB;i++){ bars[i].l=Math.max(bars[i].l,C+u-1); bars[i].c=Math.max(bars[i].c,C+u-1); bars[i].o=Math.max(bars[i].o,C+u-1);} bars[53].c=C+u;

  },
  wick(k0,bv){

    const bars=intraday(o,[[0,o],[Math.round(tt/2),C+Math.round((top-C)/2)],[tt,top],[tt+ri(3,6),top-ri(2,3)],[st,cl],[53,cl]],C+1,top,i=>i>=6&&i<=tt+4?2:i>st?0.6:1);
    for(let i=st;i<NB;i++){ bars[i].l=Math.max(bars[i].l,cl-1); bars[i].c=Math.max(cl-1,Math.min(cl,bars[i].c)); bars[i].o=bars[i-1].c; bars[i].h=Math.min(cl+1,Math.max(bars[i].o,bars[i].c)+(R()<.3?1:0));} bars[53].c=cl;

  },
  redSupport(k0,bv){
    const H=genHistory('support',k0,bv), C=H.C, S=H.S, ts=ri(20,36);
    const bars=intraday(C,[[0,C],[Math.round(ts/2),C-ri(1,2)],[ts,S],[ts+ri(4,8),S+1],[47,S+ri(0,1)],[53,S+ri(1,2)]],S,C+1,i=>i<ts?1:0.6);

  },
  downBreak(k0,bv){
    const H=genHistory('support',k0,bv), C=H.C, S=H.S, ts=ri(16,32), bk=ri(40,47), dep=ri(2,4);
    const bars=intraday(C,[[0,C],[ts,S],[bk-2,S],[bk,S-1],[53,S-dep]],S-dep-1,C+1,i=>i>=bk-1?2.4:1);
    bars[53].c=S-dep;
    scaleVol(bars,avgVol(H.days)*(1.4+R()*0.5));

  },
  rush(k0,bv){
    const H=genHistory(pick(['base','trend']),k0,bv), C=H.C, o=C+ri(0,1), rs=ri(48,50);

/* ---------- validation: regenerate if the picture breaks the textbook condition ---------- */
function validQ(q){
  const sc=q.sc, n=q.days.length, d=sc.grp==='close'?q.days[n-1]:q.days[n-2], prev=sc.grp==='close'?q.days[n-2]:q.days[n-3];
  for(const b of q.bars){ if(b.h<Math.max(b.o,b.c)||b.l>Math.min(b.o,b.c)) return false; }
  const sh=sc.shape||sc.y;
  if(sh==='sideways' && (d.h-d.l>3 || d.v>=prev.v*0.8)) return false;
  if(sh==='downClear' && !(d.l>q.S && d.c<d.o && d.v<prev.v)) return false;
  if(sh==='redSupport' && !(d.l>=q.S && d.c>q.S && d.c<d.o)) return false;
  if(sh==='downBreak' && !(d.c<q.S)) return false;
  if(sh==='bigWhite' && !(d.h-d.c<=1 && d.c-d.o>=5)) return false;
  if(sh==='wick' && !(d.h-Math.max(d.o,d.c)>=4)) return false;
  if(sh==='reclaim' && !(d.c-d.l>=4 && d.h-d.c<=2)) return false;
  if(sh==='rush'){ const s=q.bars.findIndex(b=>b.t>='16:00'); for(let i=s+1;i<NB;i++) if(q.bars[i].c<q.bars[i-1].c) return false; }
  if(q.stopRef!=null && (q.stopRef-2)<=0) return false;
  if(sc.grp==='open'){ const g=q.O-q.prevC; const gp=q.gapKind;
    if(gp==='y'&&g!==0) return false; if(gp==='r'&&g!==-1) return false; if((gp==='g'||gp==='g2')&&g<=0) return false; if(gp==='rb'&&!(q.O<q.S&&g<0)) return false; }
  return true;
}

/* ---------- helpers for the topic scenarios ---------- */
const bi = t=>{ const [h,m]=t.split(':').map(Number), mm=h*60+m; return mm<=750?(mm-600)/5:mm<870?30:30+(mm-870)/5; };
const cut = (bars,t)=>bars.slice(0,Math.max(1,bi(t)));
const swK = (a,b,o,amp=1)=>{ const k=[]; let x=a; while(x<b){ k.push([x,o+ri(-amp,amp)]); x+=ri(4,9);} k.push([b,o]); return k; };
const vU = i=> i<6?1.8 : i<30?1 : i<48?0.8 : 1.3;
function full(H,bars,x={}){ return {days:H.days.concat([agg(bars)]),bars,S:H.S,R:H.R,clock:'16:25',...x}; }
function part(H,bars,t,x={}){ fixBars(bars); const b=cut(bars,t); return {days:H.days.concat([agg(b)]),bars:b,S:H.S,R:H.R,clock:t,...x}; }
function partQ(H,bars,t,x={}){ const q=part(H,bars,t,x); q.quote={prevC:H.C,O:q.bars[0].o,last:q.bars[q.bars.length-1].c}; return q; }
function gapPack(H,ybars,tb,t,x={}){
  const yd=agg(ybars); fixBars(tb); const cb=cut(tb,t); const td=agg(cb);
  const tail=ybars.slice(36).map(b=>({...b,y:true}));
  return {days:H.days.concat([yd,td]),bars:tail.concat(cb),split:tail.length,S:H.S,R:H.R,clock:t,
    quote:{prevC:yd.c,O:cb[0].o,last:cb[cb.length-1].c},twoDay:true,...x};
}
/* today's bars after a gap (C = yesterday close) */
function tGap(C,kind,g){
  let O,k,lo,hi,vf;
  if(kind==='go'){ O=C+g; k=[[0,O],[2,O+2],[5,O+3],[12,O+5],[53,O+6]]; lo=O-1; hi=O+7; vf=i=>i<6?3:1; }
  else if(kind==='dip'){ O=C+g; const d=ri(0,1); k=[[0,O],[1,O+1],[3,C+d],[5,C+d],[8,C+2],[53,C+3]]; lo=C+d-(R()<.5?1:0); hi=O+1; vf=i=>i<2?3:i<6?0.45:1; }
  else if(kind==='fade'){ O=C+g; k=[[0,O],[1,O+1],[2,O-1],[3,C],[6,C-1],[53,C-2]]; lo=C-3; hi=O+1; vf=i=>i<4?3:1.4; }
  else if(kind==='pin'){ O=C+g; k=[[0,O],[53,O]]; lo=O; hi=O+1; vf=()=>2.4; }
  else if(kind==='tight'){ O=C+g; k=[[0,O],[1,O+1],[2,O+2],[53,O+2]]; lo=O-1; hi=O+3; vf=i=>i<3?4:1.5; }
  else if(kind==='flat'){ O=C; k=[[0,O],[53,O]]; lo=C-1; hi=C; vf=()=>0.6; }
  else if(kind==='norun'){ O=C+g; k=[[0,O],[53,O]]; lo=O-1; hi=O+1; vf=i=>i<2?2:0.5; }
  else if(kind==='down'){ O=C-g; k=[[0,O],[1,O-2],[3,O-4],[5,O-3],[53,O-4]]; lo=O-5; hi=O+1; vf=i=>i<4?3:1.2; }

const force=(b,a,z,f)=>{ for(let i=a;i<=z&&i<b.length;i++){ b[i].c=f(b[i].c); } };
/* ย่อยืน / ออกข้าง วอลุ่มแห้ง — 3 ทรงย่อย + ฐาน Day 2 แบบ (สุ่ม) */
function pauseDay(k0,bv,o={}){
  const kind=o.kind||pick(['trend','trend','support']), H=genHistory(kind,k0,bv), C=H.C;
  const v=o.v||pick(['flat','dipHold','upHold']); let b, from=0;
  if(v==='dipHold'){ const d=kind==='support'?Math.max(1,Math.min(ri(2,3),C-H.S-2)):ri(2,3), tb=ri(6,16), lv=C-d, o0=C+ri(0,1);

}
const yBars=(k0,bv,kind)=>{ if(kind) return SHAPES.sideways(k0,bv,kind);

  nleg(k0,bv){ const g=pauseDay(k0,bv,{kind:'trend'}); return part(g.H,g.bars,pick(['16:05','16:10','16:15']),{stopRef:g.stopRef,stopHint:'ใต้จุดต่ำสุดของช่วงพัก'}); },
  pauseGap(k0,bv){ const y=yBars(k0,bv), C=agg(y.bars).c, O=C+ri(2,3);

    for(let i=4;i<12;i++){ tb[i].l=Math.max(tb[i].l,O+2); tb[i].c=Math.max(tb[i].c,O+2); }
    const q=gapPack(y.H,y.bars,tb,'11:00'); q.stopRef=O+2; q.stopHint='ใต้กรอบพักใน TF 5 นาที'; return q; },
  boxMid(k0,bv){ const H=genHistory('mini',k0,bv), C=H.C; const b=intraday(C,swK(0,53,C),C-1,C+1,()=>0.7); vol(b,H,0.7); return part(H,b,'16:10',{rLabel:'กรอบบน'}); },
  shake(k0,bv){ const H=genHistory('support',k0,bv), C=H.C, S=H.S, O=C-ri(1,2), d=ri(1,2);
    const b=intraday(O,[[0,O],[2,S],[3,S-d],[4,S],[5,S+1],[6,S+1],[53,S+3]],S-d,O+1,i=>i>=2&&i<=4?3:i<2?2:0.7); b[3].l=S-d; force(b,4,53,c=>Math.max(c,S+1));
    vol(b,H,1.3); const q=part(H,b,'10:35'); q.stopRef=S-d; q.stopHint='ใต้ปลายไส้เทียน (จุดแฉลบ)'; return q; },
  nearBrk(k0,bv){ const H=genHistory('base',k0,bv), C=H.C, Rr=H.R, o=C+ri(0,1);
    const b=intraday(o,[[0,o],[8,Rr-1],...swK(10,52,Rr-1),[53,Rr-1]],Math.min(o,Rr-2),Rr-1,i=>i<8?1.2:0.45); vol(b,H,0.6);
    const q=part(H,b,'16:10',{rLabel:'แนวเบรค'}); q.stopRef=Math.min(...q.bars.slice(8).map(x=>x.l)); q.stopHint='ใต้กรอบออกข้าง'; return q; },
  longPause(k0,bv){ const H=genHistory('trend',k0,bv,{pause:ri(5,7)}), C=H.C; const b=intraday(C,swK(0,53,C),C-1,C+1,()=>0.6); vol(b,H,0.5); return part(H,b,'16:10'); },
  pauseBreak(k0,bv){ const g=SHAPES.downBreak(k0,bv); return part(g.H,g.bars,'16:00'); },
  boughtFlat(k0,bv){ const H=genHistory('trend',k0,bv), C=H.C, o=C; const b=intraday(o,[[0,o],[6,o+1],[53,o+1]],o,o+1,i=>i<6?1:0.5); vol(b,H,0.6); return part(H,b,'10:40',{entry:o+1,entryLabel:'ทุนซื้อ 10:30'}); },
  top3(k0,bv){ const H=genHistory('top3',k0,bv), C=H.C; const b=intraday(C,swK(0,53,C),C-1,C+1,()=>1.3); vol(b,H,1.4); return part(H,b,'15:50'); },
  smallNoRun(k0,bv){ const H=genHistory('trend',k0,bv), C=H.C, O=C+1; const b=intraday(O,[[0,O],[6,O+4],[8,O+3],...swK(9,17,O+3,1).slice(1),[53,O+3]],O-1,O+4,i=>i<6?2.5:0.6); vol(b,H,1.2); return part(H,b,'11:30'); },
  bottomWait(k0,bv){ const H=genHistory('bottom',k0,bv), C=H.C; const b=intraday(C,swK(0,53,C),Math.max(H.S,C-1),C+1,()=>0.6); vol(b,H,0.5); return part(H,b,'16:10'); },
  bottomBW(k0,bv){ const g=SHAPES.bigWhite(k0,bv,'bottom'); return full(g.H,g.bars,{stopRef:g.stopRef,stopHint:g.stopHint}); },
  deep(k0,bv){ const H=genHistory('bottom',k0,bv), S=H.S, o=S+1; const b=intraday(o,swK(0,53,o),S,S+2,()=>0.5); vol(b,H,0.45); return part(H,b,'16:10',{stopRef:S,stopHint:'ใต้แนวรับ (Low ของฐาน)'}); },
  /* เปิดโดด */
  gap(kind,t,g,yk){ return (k0,bv)=>{ const y=yBars(k0,bv,yk), C=agg(y.bars).c; const tb=tGap(C,kind,typeof g==='function'?g():g); vol(tb,y.H,kind==='flat'?0.6:1.6);
    const q=gapPack(y.H,y.bars,tb,t); if(kind==='dip'){ q.stopRef=Math.min(...q.bars.slice(q.split+2).map(b=>b.l)); q.stopHint='ใต้จุดที่ย่อดิฟลงมาเทส'; } return q; }; },
  gapDownSup(k0,bv){ const y=SHAPES.redSupport(k0,bv), C=agg(y.bars).c, S=y.H.S; const tb=tGap(C,'down',C-(S-ri(1,2))); vol(tb,y.H,1.8); return gapPack(y.H,y.bars,tb,'10:05'); },
  /* Overlap / ไม้ตกใจ */
  panicAM(k0,bv){ const H=genHistory('support',k0,bv), C=H.C, S=H.S, O=C-ri(1,2);
    const b=intraday(O,[[0,O],[1,O-3],[2,O-2],[3,S],[4,S+1],[5,S+1],[53,S+3]],S,O+1,i=>i===3?4:i<3?3:0.5); b[3].l=S; vol(b,H,1.6);
    const q=partQ(H,b,'10:30'); q.stopRef=S; q.stopHint='ใต้ Low ของวัน'; return q; },
  panicPM(k0,bv){ const H=genHistory('trend',k0,bv), C=H.C, o=C+ri(0,1); const b=intraday(o,[...swK(0,47,o),[48,o-2],[50,o-ri(4,6)],[53,o-6]],o-7,o+1,i=>i>=48?3.5:0.8); vol(b,H,1.3); return part(H,b,'16:15'); },
  downtrend(k0,bv){ const H=genHistory('down',k0,bv), C=H.C; const b=intraday(C,[[0,C],[53,C-ri(2,3)]],C-4,C+1,()=>1); vol(b,H,1); return part(H,b,'16:10'); },
  overlapPM(k0,bv){ const H=genHistory('support',k0,bv), C=H.C, S=H.S, O=C-1, d=ri(1,2);
    const b=intraday(O,[[0,O],[30,S+1],[42,S+1],[44,S-d],[45,S-d],[48,S+1],[50,S+2],[53,S+2]],S-d,O+1,i=>i>=43&&i<=49?2.6:0.7); vol(b,H,1.1);
    const q=part(H,b,'16:15'); q.stopRef=Math.min(...q.bars.map(x=>x.l)); q.stopHint='ใต้ปลายไส้ (จุดแฉลบ)'; return q; },
  overlapAM(t,mode){ return (k0,bv)=>{ const H=genHistory('support',k0,bv), C=H.C, S=H.S, O=C-ri(1,2), d=ri(1,2); let k;
    if(mode==='fail') k=[[0,O],[2,S],[4,S-2],[6,S-2],[8,S-3],[53,S-3]];
    else if(mode==='flat') k=[[0,O],[2,S],[3,S-d],[4,S],[5,S+1],[10,S+1],[53,S+1]];
    else k=[[0,O],[2,S],[3,S-d],[4,S],[5,S+1],[6,S+2],[53,S+3]];
    const b=intraday(O,k,mode==='fail'?S-4:S-d,O+1,i=>i>=2&&i<=5?3:i<2?2:0.6); if(mode!=='fail') b[3].l=S-d; vol(b,H,1.3);
    const q=part(H,b,t); if(mode==='ok'){ q.stopRef=S-d; q.stopHint='ใต้ปลายไส้ (จุดแฉลบ)'; } if(mode==='flat'){ q.entry=S+1; q.entryLabel='ทุนซื้อ 10:25'; } return q; }; },
  /* ชิดเย็น */
  vshape(k0,bv){ const g=SHAPES.reclaim(k0,bv); return part(g.H,g.bars,'16:25',{stopRef:g.stopRef,stopHint:g.stopHint}); },
  vfail(k0,bv){ const H=genHistory('support',k0,bv), C=H.C, S=H.S; const b=intraday(C,[[0,C],[30,S+1],[40,S-2],[44,S-3],[53,S-3]],S-4,C+1,i=>i>=38&&i<=44?2.5:0.8); vol(b,H,1.3); return part(H,b,'16:20'); },
  ranAM(k0,bv){ const H=genHistory('trend',k0,bv), C=H.C, o=C+1, up=ri(5,7); const b=intraday(o,[[0,o],[ri(10,20),C+up],...swK(26,52,C+up,0).slice(1),[53,C+up]],C,C+up,i=>i<20?2:0.9); vol(b,H,1.6); return part(H,b,'16:15'); },
  timing(k0,bv){ const g=pauseDay(k0,bv); return part(g.H,g.bars,pick(['15:25','15:30'])); },
  /* Breakout */
  brkClose(k0,bv){ const H=genHistory('base',k0,bv), C=H.C, Rr=H.R;

    const q=part(H,b,'16:10',{rLabel:'แนวเบรค'}); q.stopRef=Math.min(...q.bars.slice(12,48).map(x=>x.l)); q.stopHint='ใต้กรอบที่พักก่อนเบรค'; return q; },
  brkSpike(t){ return (k0,bv)=>{ const H=genHistory('base',k0,bv), C=H.C, Rr=H.R, top=Rr+ri(4,6);

  brkLunch(k0,bv){ const H=genHistory('base',k0,bv), C=H.C, Rr=H.R;

  range(where,mode,t){ return (k0,bv)=>{ const H=genHistory('range',k0,bv,{where}), C=H.C, S=H.S, Rr=H.R; let k,lo,hi,vf=()=>0.7;

    const q=part(H,b,t,{rLabel:'กรอบบน',sLabel:'กรอบล่าง'}); if(mode==='sit'){ q.stopRef=S; q.stopHint='ใต้กรอบล่าง'; } return q; }; },
  smallBottom(k0,bv){ const H=genHistory('bottom',k0,bv), C=H.C; const b=intraday(C,[[0,C],[10,C+3],[30,C+2],[53,C+1]],Math.max(H.S,C-1),C+3,i=>i<12?2:0.8); vol(b,H,1.2); return part(H,b,'16:15'); },

  /* ตลาด (ดัชนี SET) */
  idx(kind){ return (k0,bv)=>{ let H,b,C;

    else if(kind==='flat'){ H=genHistory('trend',k0,bv); C=H.C; b=intraday(C,swK(0,53,C,1),C-1,C+1,()=>0.8); }
    else if(kind==='swing'){ H=genHistory('trend',k0,bv); C=H.C; const O=C-3; b=intraday(O,[[0,O],[1,O+4],[2,O-1],[53,O]],O-2,O+4,()=>3); }
    else if(kind==='res'){ H=genHistory('range',k0,bv,{where:'top'}); C=H.C; b=intraday(C,[[0,C],[20,H.R],[53,H.R]],C-1,H.R,()=>1); }
    else if(kind==='sup'){ H=genHistory('support',k0,bv); C=H.C; const S=H.S; b=intraday(C,[[0,C],[25,S+1],[53,S+1]],S,C+1,()=>0.9); }
    else if(kind==='break'){ H=genHistory('support',k0,bv); C=H.C; const S=H.S; b=intraday(C,[[0,C],[20,S],[40,S-4],[53,S-7]],S-8,C+1,i=>i>20?1.8:1); }
    else if(kind==='fed'){ H=genHistory('trend',k0,bv); C=H.C; const O=C-4; b=intraday(O,[[0,O],[10,O-2],[53,O-3]],O-4,O+1,()=>1); }
    else { H=genHistory('trend',k0,bv); C=H.C; b=intraday(C,[[0,C],[53,C+2]],C-1,C+3,()=>0.9); }
    vol(b,H,1); const q=part(H,b,kind==='swing'?'10:10':'16:10'); if(kind==='res') q.rLabel='แนวต้าน'; if(kind==='swing'||kind==='fed') q.quote={prevC:H.C,O:q.bars[0].o,last:q.bars[q.bars.length-1].c}; return q; }; },

  rush(t){ return (k0,bv)=>{ const g=SHAPES.rush(k0,bv); return part(g.H,g.bars,t); }; },
  hold(t){ return (k0,bv)=>{ const g=SHAPES.holdStrong(k0,bv); return part(g.H,g.bars,t); }; },
  brk(t){ return (k0,bv)=>{ const g=SHAPES.downBreak(k0,bv); return part(g.H,g.bars,t); }; },
  vback(t){ return (k0,bv)=>{ const g=SHAPES.reclaim(k0,bv); return part(g.H,g.bars,t,{stopRef:g.stopRef,stopHint:g.stopHint}); }; },
  vfail(t){ return (k0,bv)=>{ const H=genHistory('support',k0,bv), C=H.C, S=H.S, d=ri(2,3), tb=ri(36,44);
    const b=intraday(C,[[0,C],[ri(14,28),S+1],[tb,S-d],[53,S-d]],S-d-1,C+1,i=>i>=tb-4&&i<=tb+2?2.5:0.8); force(b,tb,53,c=>Math.min(c,S-1)); vol(b,H,1.3); return part(H,b,t); }; },
  brkLate(t){ return (k0,bv)=>{ const H=genHistory('base',k0,bv), C=H.C, Rr=H.R, top=Rr+ri(4,6), s0=ri(41,44);
    const b=intraday(C,[[0,C],[8,Rr-1],...swK(10,s0-1,Rr-1).slice(1),[s0,Rr+1],[s0+3,top],[53,top]],Math.min(C,Rr-2),top+1,i=>i<8?1.1:i<s0?0.45:4.5); force(b,s0+2,53,c=>Math.max(c,Rr+2)); vol(b,H,2.2);
    return part(H,b,t,{rLabel:'แนวเบรค'}); }; },
  bw1(t){ return (k0,bv)=>{ const g=SHAPES.bigWhite(k0,bv); return part(g.H,g.bars,t,{stopRef:g.stopRef,stopHint:g.stopHint}); }; },
  bw2(t){ return (k0,bv)=>{ const H=genHistory('bw2',k0,bv), C=H.C, O=C+ri(0,1), u=ri(2,3), tb=ri(6,14);
    const b=intraday(O,[[0,O],[tb,C+u],...swK(tb+2,52,C+u,0).map(([x,y])=>[x,y-ri(0,1)]),[53,C+u]],C,C+u,i=>i<=tb?1.4:0.5); vol(b,H,0.8);
    const q=part(H,b,t); q.stopRef=Math.min(...q.bars.slice(tb).map(x=>x.l)); q.stopHint='ใต้กรอบที่ย่อยืน'; return q; }; },
};

  if(ch.bars&&ch.bars.length){ const lo=Math.min(...ch.bars.map(x=>x.l)), hi=Math.max(...ch.bars.map(x=>x.h)), near=x=>x.k>=lo-3&&x.k<=hi+3;
    const m=L.filter(near); if(ch.prevC!=null && near({k:ch.prevC})) m.push({k:ch.prevC,label:'ปิดวันก่อน',color:'var(--ink2)',dash:'2 3'});
    drawChart($('m5Svg'),ch.bars,{lines:m,times:true,split:ch.split,minN:ch.split?0:24,ratio:0.5,minH:220,maxH:320}); }
}

/* ---------- timer ---------- */
function syncTimerBtn(){ $('timerBtn').setAttribute('aria-pressed',timerOn); }
function startTimer(){
  clearTimeout(tmr); const bar=$('timer'), f=$('timerFill');
  if(!timerOn){ bar.hidden=true; return; }
  bar.hidden=false; f.style.transition='none'; f.style.width='100%'; void f.offsetWidth;
  f.style.transition='width 10s linear'; f.style.width='0%';
  tmr=setTimeout(()=>{ if(phase==='ask') grade(null,true); },10000);
}
function stopTimer(){ clearTimeout(tmr); const f=$('timerFill'); const w=getComputedStyle(f).width; f.style.transition='none'; f.style.width=w; }

/* ---------- answering ---------- */
function answer(k){ if(phase!=='ask') return; stopTimer(); grade(k,false); }
const esc=t=>String(t||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function grade(k,timeout){
  phase='done';
  const q=cur.q, s=cur.s, steps=cur.steps||stepsOf(q), last=cur.step===steps.length-1;
  const picked=s.options.find(o=>o.id===k), ok=!!(picked&&picked.correct);
  if(!ok) cur.allOk=false;
  [...$('answers').children].forEach(b=>{ const o=s.options.find(x=>x.id===b.dataset.k); b.disabled=true; if(o.correct) b.classList.add('right'); else if(b.dataset.k===k) b.classList.add('wrong'); });
  const list=cur.opts.map(o=>`<li class="${o.correct?'ok':'no'}${o.id===k?' me':''}"><span class="mk">${o.correct?'✓':'✗'}</span><div><b>${esc(o.text)}</b>${o.id===k?' <span class="mine">คุณเลือก</span>':''}${o.why?`<p>${esc(o.why)}</p>`:''}</div></li>`).join('');
  const isGen=q.kind==='gen', TB=isGen?cur.roundTB:q.textbook; const pend = isGen? cur.roundPend : (q.source && /รอเข้าตำรา/.test(q.source));
  let tail='';
  if(last){
    const okAll=cur.allOk;
    const st=stats.by[q.id]||{seen:0,right:0}; st.seen++; if(okAll) st.right++; stats.by[q.id]=st; saveStats(); renderScore();
    tail=`${steps.length>1?`<p class="chainres ${okAll?'ok':'no'}">${okAll?'ผ่านครบทุกขั้น':'ยังพลาดบางขั้น'} (${steps.length} ขั้น)</p>`:''}
      <dl><dt>ตำรา</dt><dd>หัวข้อ ${esc(TB)}</dd></dl>${pend?'<span class="tag">ยังไม่อยู่ในตำรา — มาจากไฟล์เสียงคลาส</span>':''}
      <button class="next" id="nextBtn">ข้อถัดไป</button>`;
  } else tail=`<button class="next" id="nextBtn">ขั้นถัดไป (${cur.step+2}/${steps.length})</button>`;
  $('fb').className='fb on '+(ok?'ok':'no');
  $('fb').innerHTML=`<p class="verdict">${ok?'ถูก':(timeout?'หมดเวลา 10 วินาที':'ยังไม่ถูก')}</p>
    ${isGen&&s.sit?`<dl><dt>ภาพนี้คือ</dt><dd>${esc(s.sit.setup)}${s.sit.setup.includes(s.vname)?'':` <span class="dim">(${esc(s.vname)})</span>`}</dd><dt>สภาวะในตำรา</dt><dd>${esc(s.sit.market)} · ${esc(s.sit.holding)}</dd></dl>`:''}<ul class="whys">${list}</ul>
    <dl>${s.principle?`<dt>หลักคิด</dt><dd>${esc(s.principle)}</dd>`:''}${s.quote?`<dt>${isGen?'หลักคิด':'คำพูดอาจารย์'}</dt><dd><blockquote>“${esc(s.quote)}”</blockquote></dd>`:''}</dl>
    ${tail}`;
  $('nextBtn').onclick=()=>{ if(last) show(); else { cur.step++; renderStep(); } };
  if(!EMBED) $('fb').scrollIntoView({block:'nearest',behavior:'smooth'});
}

/* ---------- stats dialog ---------- */
function renderStats(){
  const [S0,R0]=sumOf(ALL_Q);
  let h=`<p class="grouph">รวมทุกหมวด ${S0?`— ถูก ${Math.round(R0/S0*100)}% จาก ${S0} ข้อ`:''}</p>`;
  CATS.forEach(cat=>{
    const list=ALL_Q.filter(q=>q.category===cat), [S,Rr]=sumOf(list), p=S?Math.round(Rr/S*100):0;
    const rows=list.map(q=>{ const x=stats.by[q.id]||{seen:0,right:0}; const pp=x.seen?Math.round(x.right/x.seen*100):0; const s0=stepsOf(q)[0];
      return `<div class="statrow"><span>${q.kind==='gen'?esc(q.sc.name):`${q.id} · ${esc(s0.question)} <small class="dim">${DIFF_TXT[q.difficulty]}${q.type==='chain'?' · ต่อเนื่อง':''}</small>`}</span><span class="bar"><i style="width:${pp}%"></i></span><span class="n">${x.seen?pp+'%':'—'} <small>/${x.seen}</small></span></div>`; }).join('');
    h+=`<details><summary class="statrow"><span><b>${esc(cat)}</b></span><span class="bar"><i style="width:${p}%"></i></span><span class="n">${S?p+'%':'—'} <small>/${S}</small></span></summary>${rows}</details>`;
  });
  $('statsBody').innerHTML = h + '<p class="saveinfo">ข้อที่ผิดบ่อยจะถูกสุ่มขึ้นมาบ่อยขึ้น · แตะชื่อหมวดเพื่อดูรายข้อ</p>';
  $('saveInfo').textContent = store?'บันทึกสถิติไว้กับบัญชีของคุณ ใช้ข้ามวัน/ข้ามเครื่องได้':'สถิติเก็บในเบราว์เซอร์เครื่องนี้';
}
$('statsBtn').onclick=()=>{ renderStats(); $('statsDlg').showModal(); };
$('closeDlg').onclick=()=>$('statsDlg').close();
$('resetBtn').onclick=()=>{ if(confirm('ล้างสถิติทั้งหมด?')){ stats={by:{}}; saveStats(); renderScore(); renderStats(); } };
$('timerBtn').onclick=()=>{ timerOn=!timerOn; syncTimerBtn(); saveStats(); if(phase==='ask') startTimer(); };

/* ---------- embed mode: ?embed=1 inside survivor.html (iframe) ---------- */

if(EMBED){
  const ps=new URLSearchParams(location.search);
  document.documentElement.classList.add('embed');
  document.documentElement.setAttribute('data-theme', ps.get('theme')||'light');
  const sendH=()=>{ try{ parent.postMessage({type:'survivor-practice-height',h:document.documentElement.scrollHeight},'*'); }catch(e){} };
  try{ new ResizeObserver(sendH).observe(document.body); }catch(e){}
  window.addEventListener('load',sendH); setTimeout(sendH,300);
}
let _cw=0; try{ new ResizeObserver(()=>{ const w=document.querySelector('.charts').clientWidth; if(cur&&cur.ch&&Math.abs(w-_cw)>2){ _cw=w; requestAnimationFrame(drawAll); } }).observe(document.querySelector('.charts')); }catch(e){}
mode='all'; if(topic!=='all' && !CATS.includes(topic)) topic='all';
diff='all';
syncTimerBtn(); renderTopics(); renderScore(); show();

</script>
