<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ฝึกตัดสินใจหน้าเทรด — วิถี Survivor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---- palette: matches survivor.html (main page is the standard) ---- */
:root{
  --bg:#E9EDF0; --surface:#FFFFFF; --sunk:#DFE5EA; --ink:#16212B; --ink2:#586673; --line:#C9D2D9;
  --up:#0B7F57; --down:#B4302A; --flat:#8A6200; --accent:#2B4C7E; --accentInk:#fff;
  --upSoft:#DCF0E6; --downSoft:#F7DEDB; --flatSoft:#F5EBC8;
  --zone:rgba(43,76,126,.15);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* dark: same tokens as survivor.html (bg/surface/ink/muted/line/soft + go/wait/exit) */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F171E; --surface:#172129; --sunk:#1C2832; --ink:#E3E9EE; --ink2:#93A1AD; --line:#2A3743;
    --up:#3CC48F; --down:#F0675C; --flat:#E2B44B; --accent:#8DB2EA; --accentInk:#0F171E;
    --upSoft:#12312A; --downSoft:#3E1D1B; --flatSoft:#3A3013;
    --zone:rgba(141,178,234,.2);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F171E; --surface:#172129; --sunk:#1C2832; --ink:#E3E9EE; --ink2:#93A1AD; --line:#2A3743;
  --up:#3CC48F; --down:#F0675C; --flat:#E2B44B; --accent:#8DB2EA; --accentInk:#0F171E;
  --upSoft:#12312A; --downSoft:#3E1D1B; --flatSoft:#3A3013;
  --zone:rgba(141,178,234,.2);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{font-size:16px;scroll-padding-top:env(safe-area-inset-top,0px)}
@media (min-width:900px){html{font-size:17px}}
@media (min-width:1400px){html{font-size:18px}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai","Sukhumvit Set","Thonburi","Noto Sans Thai",system-ui,sans-serif;font-size:1rem;line-height:1.55;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1560px;margin:0 auto;padding:16px 16px 40px}
@media (min-width:900px){.wrap{padding:20px 28px 48px}}
@media (min-width:1400px){.wrap{padding-left:40px;padding-right:40px}}
header{display:flex;align-items:center;gap:.6rem;padding:.4rem 0 .75rem}
header h1{font-size:1.2rem;font-weight:700;margin:0;line-height:1.25}
header h1 small{display:block;font-size:.8rem;font-weight:400;color:var(--ink2)}
.spacer{flex:1}
.iconbtn{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:.6rem;padding:.45rem .7rem;font:inherit;font-size:.88rem;cursor:pointer;min-height:2.5rem}
.iconbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{display:flex;flex-wrap:wrap;align-items:baseline;gap:.25rem .6rem;margin:.25rem 0 .5rem}
.clock{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1}
.stageName{flex:1 1 auto;color:var(--ink2);font-size:.92rem}
.ctx{display:flex;flex-wrap:wrap;gap:.375rem;margin:0 0 .6rem;padding:0;list-style:none}
.ctx li{background:var(--surface);border:1px solid var(--line);border-radius:.5rem;padding:.25rem .55rem;font-size:.86rem;max-width:100%;overflow-wrap:anywhere}
.ctx li b{font-weight:600}
.note{font-size:.9rem;background:var(--sunk);border-radius:.5rem;padding:.5rem .65rem;margin:0 0 .6rem}
.quote{display:flex;gap:.5rem .9rem;align-items:flex-end;flex-wrap:wrap;margin:0 0 .6rem;font-variant-numeric:tabular-nums}
.quote>div{min-width:0}
.quote .px{display:inline-block;font-size:clamp(1.2rem,5.6vw,1.5rem);font-weight:700;padding:.1rem .55rem;border-radius:.5rem;white-space:nowrap}
.quote .lbl{font-size:.82rem;color:var(--ink2);display:block}
.px.up{color:var(--up);background:var(--upSoft)} .px.down{color:var(--down);background:var(--downSoft)} .px.flat{color:var(--flat);background:var(--flatSoft)}
.px.plain{color:var(--ink);padding-left:0}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:.75rem;padding:.375rem .375rem .125rem;margin:0 0 .5rem;position:relative}
.chart .cap{font-size:.78rem;color:var(--ink2);padding:0 .25rem;display:flex;justify-content:space-between;gap:.5rem}
.chart svg{display:block;width:100%;height:auto;touch-action:manipulation}
.chart.tapping{outline:2px dashed var(--accent);outline-offset:-2px;cursor:crosshair}
.sim{font-size:.75rem;color:var(--ink2);text-align:center;margin:.125rem 0 .75rem}
.timer{height:.3rem;background:var(--sunk);border-radius:.2rem;overflow:hidden;margin:0 0 .6rem}
.timer i{display:block;height:100%;background:var(--accent);width:100%;transition:width linear}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.answers button{min-height:3.6rem;border-radius:.75rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:1rem;cursor:pointer;padding:.5rem .6rem;line-height:1.3;overflow-wrap:anywhere}
.answers button:active{transform:scale(.98)}
.answers button.pick{border-color:var(--accent);background:var(--zone)}
.answers button.right{border-color:var(--up);background:var(--upSoft)}
.answers button.wrong{border-color:var(--down);background:var(--downSoft)}
.answers button:disabled{cursor:default}
.answers.n3{grid-template-columns:1fr 1fr 1fr}
@media (max-width:440px){.answers.n3{grid-template-columns:1fr 1fr}.answers.n3 button:last-child{grid-column:span 2}.answers button{font-size:.95rem}}
.stopbar{display:none;margin:.6rem 0 0;background:var(--surface);border:1.5px solid var(--accent);border-radius:.75rem;padding:.6rem}
.stopbar.on{display:block}
.stopbar p{margin:0 0 .5rem;font-size:.92rem}
.stoprow{display:flex;gap:.5rem;align-items:center}
.stoprow .val{flex:1;min-width:0;text-align:center;font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.stoprow button{min-width:3.2rem;min-height:2.9rem;border-radius:.6rem;border:1px solid var(--line);background:var(--sunk);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.stoprow button.go{background:var(--accent);color:var(--accentInk);border-color:var(--accent);min-width:6.2rem}
.stoprow button:disabled{opacity:.45}
.fb{display:none;margin:.75rem 0 0;border-radius:.9rem;padding:.9rem;background:var(--surface);border:1px solid var(--line)}
.fb.on{display:block}
.fb .verdict{font-size:1.25rem;font-weight:700;margin:0 0 .25rem}
.fb.ok .verdict{color:var(--up)} .fb.no .verdict{color:var(--down)}
.fb .sub{color:var(--ink2);font-size:.9rem;margin:0 0 .6rem}
.fb dl{margin:0}
.fb dt{font-size:.8rem;color:var(--ink2);margin-top:.6rem}
.fb dd{margin:.125rem 0 0}
.fb blockquote{margin:.6rem 0 0;padding:.5rem .75rem;border-left:3px solid var(--accent);background:var(--sunk);border-radius:0 .5rem .5rem 0;font-size:.98rem}
.tag{display:inline-block;font-size:.8rem;padding:.125rem .5rem;border-radius:.375rem;background:var(--flatSoft);color:var(--ink);margin-top:.5rem}
.next{margin-top:.9rem;width:100%;min-height:3.4rem;border-radius:.75rem;border:0;background:var(--ink);color:var(--surface);font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
.score{white-space:nowrap;font-size:.85rem;color:var(--ink2);font-variant-numeric:tabular-nums}
dialog{border:1px solid var(--line);border-radius:.9rem;background:var(--surface);color:var(--ink);max-width:36rem;width:calc(100% - 1.5rem);padding:1rem}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{font-size:1.05rem;margin:0 0 .6rem}
.statrow{display:grid;grid-template-columns:1fr 4rem 3.2rem;gap:.5rem;align-items:center;font-size:.9rem;padding:.3rem 0;border-bottom:1px solid var(--line)}
.statrow .bar{height:.375rem;background:var(--sunk);border-radius:.2rem;overflow:hidden}
.statrow .bar i{display:block;height:100%;background:var(--up)}
.statrow .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.grouph{font-weight:600;margin:.75rem 0 .125rem;font-size:.92rem}
.dlgbtns{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.9rem}
.saveinfo{font-size:.78rem;color:var(--ink2);margin-top:.5rem}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details .statrow{padding-left:.75rem}
details summary.statrow{padding-left:0}
.topics{display:flex;flex-wrap:wrap;gap:.4rem;padding:0 0 .75rem;margin:0 0 .25rem;border-bottom:1px solid var(--line)}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:.35rem .75rem;font:inherit;font-size:.92rem;cursor:pointer;white-space:nowrap;min-height:2.3rem}
.chip small{margin-left:.35rem;color:var(--ink2);font-size:.78em}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:var(--surface);opacity:.75}
.topicTag{margin:0 0 .125rem;font-size:.82rem;color:var(--accent);font-weight:600}
.topicTag:empty{display:none}
.dim{color:var(--ink2)}
.qline{font-weight:600;font-size:1.02rem;margin:-.125rem 0 .5rem}
.qline:empty{display:none}
/* wide screens: charts left, question + answers right */
@media (min-width:980px){
  main#q{display:grid;grid-template-columns:minmax(0,46rem) minmax(20rem,1fr);grid-template-areas:"charts info" "charts act";grid-template-rows:auto 1fr;column-gap:1.4rem}
  main#q .info{grid-area:info} main#q .charts{grid-area:charts} main#q .act{grid-area:act}
  .charts{position:sticky;top:.5rem;align-self:start}
}
/* embed (?embed=1 inside survivor.html): full iframe width, no side padding */
html.embed body{background:transparent}
html.embed .wrap{max-width:none;padding:0 0 1.5rem}
html.embed header{padding-top:0}
html.embed header h1{display:none}
@media (prefers-reduced-motion:reduce){.timer i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ฝึกตัดสินใจหน้าเทรด<small>แบบฝึกหัดวิถี Survivor · สุ่มกราฟจากรูปแบบในตำรา</small></h1>
    <span class="spacer"></span>
    <button class="iconbtn" id="timerBtn" aria-pressed="false" title="จับเวลา 10 วินาที">⏱ 10 วิ</button>
    <button class="iconbtn" id="statsBtn">สถิติ</button>
  </header>
  <nav class="topics" id="topics" aria-label="เลือกหมวด"></nav>

  <main id="q">
   <div class="info">
    <p class="topicTag" id="topicTag"></p>
    <div class="stage"><span class="clock" id="clock"></span><span class="stageName" id="stageName"></span><span class="spacer"></span><span class="score" id="score"></span></div>
    <p class="qline" id="qline"></p>
    <ul class="ctx" id="ctx"></ul>
    <p class="note" id="note" hidden></p>
    <div class="quote" id="quote" hidden></div>
   </div>
   <div class="charts">
    <div class="chart" id="dayBox"><div class="cap"><span id="dayT">TF Day</span><span id="dayCap"></span></div><svg id="daySvg" viewBox="0 0 360 210" role="img" aria-label="กราฟแท่งเทียนรายวัน"></svg></div>
    <div class="chart" id="m5Box"><div class="cap"><span id="m5T">TF 5 นาที</span><span id="m5Cap"></span></div><svg id="m5Svg" viewBox="0 0 360 200" role="img" aria-label="กราฟ 5 นาที"></svg></div>
    <p class="sim">กราฟจำลองเพื่อฝึกหลักคิด ไม่ใช่ข้อมูลหุ้นจริง · ไม่ใช่สัญญาณซื้อขาย</p>
   </div>
   <div class="act">
    <div class="timer" id="timer" hidden><i id="timerFill"></i></div>
    <div class="answers" id="answers"></div>
    <div class="stopbar" id="stopbar">
      <p>แตะกราฟ 5 นาทีตรงจุดที่จะวาง Stop แล้วปรับทีละช่อง</p>
      <div class="stoprow">
        <button id="stDown" aria-label="ลง 1 ช่อง">−1</button>
        <span class="val" id="stVal">แตะกราฟ</span>
        <button id="stUp" aria-label="ขึ้น 1 ช่อง">+1</button>
        <button class="go" id="stGo" disabled>ยืนยัน Stop</button>
      </div>
    </div>
    <section class="fb" id="fb" aria-live="polite"></section>
   </div>
  </main>
</div>

<dialog id="statsDlg">
  <h2>สถิติ</h2>
  <div id="statsBody"></div>
  <p class="saveinfo" id="saveInfo"></p>
  <div class="dlgbtns"><button class="iconbtn" id="resetBtn">ล้างสถิติ</button><button class="iconbtn" id="closeDlg">ปิด</button></div>
</dialog>

<script>

function buildDays(closes, volMult, baseVol){

    const h = Math.max(o,c)+(R()<.55?ri(1,2):0);
    const l = Math.min(o,c)-(R()<.55?ri(1,2):0);
    days.push({o,h,l,c,v:baseVol*(volMult[i]||1)*(0.75+R()*0.5)});
    prev=c;
  });

function walk(points,n,noise){
  const out=[];
  for(let i=0;i<n;i++){
    let j=0; while(j<points.length-2 && points[j+1][0]<=i) j++;

    const t = x1===x0?0:(i-x0)/(x1-x0);
    out.push(Math.round(y0+(y1-y0)*Math.min(1,Math.max(0,t)) + (noise?ri(-noise,noise):0)));

  return out;

    const d=agg(bars); return {H,bars,stopRef:d.l,stopHint:'ใต้กรอบออกข้าง (Low ของวัน)'};
  },
  holdStrong(k0,bv){
    const H=history('trend',k0,bv), C=H.C, o=C+ri(0,1), up=ri(4,7), pk=ri(12,26), dp=ri(34,44);
    const bars=intraday(o,[[0,o],[pk,C+up],[pk+4,C+up-1],[dp,C+up-ri(1,2)],[dp+4,C+up-1],[53,C+up]],C,C+up,ush);
    bars[53].c=C+up; bars[53].h=C+up;
    scaleVol(bars,avgVol(H.days)*(1.0+R()*0.4));
    return {H,bars};
  },
  reclaim(k0,bv){
    const H=history('trend',k0,bv), C=H.C, o=C+ri(0,1), m=ri(2,4), mt=ri(8,20);
    const ds=ri(mt+4,38), db=Math.min(44,ds+ri(3,7)), dd=ri(3,5), rs=ri(45,47), re=ri(50,52);
    const bars=intraday(o,[[0,o],[mt,C+m],[ds,C+m-ri(0,1)],[db,C-dd],[rs,C-dd+ri(0,1)],[re,C+ri(1,m)],[53,C+ri(1,m)]],C-dd,C+m,
      i=>i>=ds&&i<=db?2.2:i>=rs&&i<=re?2.6:ush(i));
    scaleVol(bars,avgVol(H.days)*(1.1+R()*0.5));
    const d=agg(bars); return {H,bars,stopRef:d.l,stopHint:'ใต้ปลายไส้ (จุดที่ทุบลงไปต่ำสุด)'};
  },
  bigWhite(k0,bv,kind='base'){
    const H=history(kind,k0,bv), C=H.C, o=C+ri(0,1), u=ri(6,11), bx=ri(44,48);
    const half=Math.round(u*(0.4+R()*0.2)), t1=ri(10,20);
    const bars=intraday(o,[[0,o],[t1,C+half],[t1+ri(4,8),C+half-1],[ri(34,42),C+u-1],[bx,C+u],[53,C+u]],C,C+u,i=>i<20?1.6:i<bx?1.1:0.7);
    for(let i=bx;i<NB;i++){ bars[i].l=Math.max(bars[i].l,C+u-1); bars[i].c=Math.max(bars[i].c,C+u-1); bars[i].o=Math.max(bars[i].o,C+u-1);} bars[53].c=C+u;
    scaleVol(bars,avgVol(H.days)*(2.4+R()*1.0));
    const box=Math.min(...bars.slice(bx).map(b=>b.l));
    return {H,bars,stopRef:box,stopHint:'ใต้กรอบที่ย่อยืนชิดเย็น'};
  },
  wick(k0,bv){
    const H=history('base',k0,bv), C=H.C, o=C+ri(0,1), top=C+ri(8,12), tt=ri(16,32), cl=C+ri(3,4), st=ri(38,44);
    const bars=intraday(o,[[0,o],[Math.round(tt/2),C+Math.round((top-C)/2)],[tt,top],[tt+ri(3,6),top-ri(2,3)],[st,cl],[53,cl]],C+1,top,i=>i>=6&&i<=tt+4?2:i>st?0.6:1);
    for(let i=st;i<NB;i++){ bars[i].l=Math.max(bars[i].l,cl-1); bars[i].c=Math.max(cl-1,Math.min(cl,bars[i].c)); bars[i].o=bars[i-1].c; bars[i].h=Math.min(cl+1,Math.max(bars[i].o,bars[i].c)+(R()<.3?1:0));} bars[53].c=cl;
    scaleVol(bars,avgVol(H.days)*(2.2+R()*1.0));
    const box=Math.min(...bars.slice(st).map(b=>b.l));
    return {H,bars,stopRef:box,stopHint:'ใต้กรอบที่ยืนได้หลังเคลียร์บน'};
  },
  downClear(k0,bv){
    const H=history('support',k0,bv), C=H.C, S=H.S, end=Math.max(S+1,C-ri(2,4));
    const bars=intraday(C,[[0,C],[ri(10,20),C-1],[ri(26,40),Math.max(end,C-2)],[53,end]],S+1,C+1,i=>i<6?1:0.55);
    bars[53].c=end;
    scaleVol(bars,minV(H.days,3)*(0.5+R()*0.15));
    return {H,bars,stopRef:S,stopHint:'ใต้แนวรับ Day'};
  },
  redSupport(k0,bv){
    const H=history('support',k0,bv), C=H.C, S=H.S, ts=ri(20,36);
    const bars=intraday(C,[[0,C],[Math.round(ts/2),C-ri(1,2)],[ts,S],[ts+ri(4,8),S+1],[47,S+ri(0,1)],[53,S+ri(1,2)]],S,C+1,i=>i<ts?1:0.6);
    bars[ts].l=S; bars[53].c=Math.max(S+1,bars[53].c);
    scaleVol(bars,avgVol(H.days)*(0.65+R()*0.25));
    return {H,bars,stopRef:S,stopHint:'ใต้แนวรับ Day ที่ย่อมายืน'};
  },
  downBreak(k0,bv){
    const H=history('support',k0,bv), C=H.C, S=H.S, ts=ri(16,32), bk=ri(40,47), dep=ri(2,4);
    const bars=intraday(C,[[0,C],[ts,S],[bk-2,S],[bk,S-1],[53,S-dep]],S-dep-1,C+1,i=>i>=bk-1?2.4:1);
    bars[53].c=S-dep;
    scaleVol(bars,avgVol(H.days)*(1.4+R()*0.5));
    return {H,bars};
  },
  rush(k0,bv){
    const H=history(pick(['base','trend']),k0,bv), C=H.C, o=C+ri(0,1), rs=ri(48,50);
    const bars=intraday(o,[[0,o],[rs-1,o]],o-1,o+1,i=>i<rs?0.5:3.2,1);
    for(let i=rs;i<NB;i++){ const o2=bars[i-1].c, lv=o2+1+(R()<.3?1:0); bars[i]={o:o2,c:lv,h:lv,l:o2,v:bars[i].v,t:bars[i].t}; }
    scaleVol(bars,avgVol(H.days)*(1.3+R()*0.5));
    return {H,bars};
  }
};

/* ---------- validation: regenerate if the picture breaks the textbook condition ---------- */
function validQ(q){
  const sc=q.sc, n=q.days.length, d=sc.grp==='close'?q.days[n-1]:q.days[n-2], prev=sc.grp==='close'?q.days[n-2]:q.days[n-3];
  for(const b of q.bars){ if(b.h<Math.max(b.o,b.c)||b.l>Math.min(b.o,b.c)) return false; }
  const sh=sc.shape||sc.y;
  if(sh==='sideways' && (d.h-d.l>3 || d.v>=prev.v*0.8)) return false;
  if(sh==='downClear' && !(d.l>q.S && d.c<d.o && d.v<prev.v)) return false;
  if(sh==='redSupport' && !(d.l>=q.S && d.c>q.S && d.c<d.o)) return false;
  if(sh==='downBreak' && !(d.c<q.S)) return false;
  if(sh==='bigWhite' && !(d.h-d.c<=1 && d.c-d.o>=5)) return false;
  if(sh==='wick' && !(d.h-Math.max(d.o,d.c)>=4)) return false;
  if(sh==='reclaim' && !(d.c-d.l>=4 && d.h-d.c<=2)) return false;
  if(sh==='rush'){ const s=q.bars.findIndex(b=>b.t>='16:00'); for(let i=s+1;i<NB;i++) if(q.bars[i].c<q.bars[i-1].c) return false; }
  if(q.stopRef!=null && (q.stopRef-2)<=0) return false;
  if(sc.grp==='open'){ const g=q.O-q.prevC; const gp=q.gapKind;
    if(gp==='y'&&g!==0) return false; if(gp==='r'&&g!==-1) return false; if((gp==='g'||gp==='g2')&&g<=0) return false; if(gp==='rb'&&!(q.O<q.S&&g<0)) return false; }
  return true;
}

/* ---------- helpers for the topic scenarios ---------- */
const bi = t=>{ const [h,m]=t.split(':').map(Number), mm=h*60+m; return mm<=750?(mm-600)/5:30+(mm-870)/5; };
const cut = (bars,t)=>bars.slice(0,Math.max(1,bi(t)));
const swK = (a,b,o,amp=1)=>{ const k=[]; let x=a; while(x<b){ k.push([x,o+ri(-amp,amp)]); x+=ri(4,9);} k.push([b,o]); return k; };
const vU = i=> i<6?1.8 : i<30?1 : i<48?0.8 : 1.3;
function full(H,bars,x={}){ return {days:H.days.concat([agg(bars)]),bars,S:H.S,R:H.R,clock:'16:25',...x}; }
function part(H,bars,t,x={}){ fixBars(bars); const b=cut(bars,t); return {days:H.days.concat([agg(b)]),bars:b,S:H.S,R:H.R,clock:t,...x}; }
function partQ(H,bars,t,x={}){ const q=part(H,bars,t,x); q.quote={prevC:H.C,O:q.bars[0].o,last:q.bars[q.bars.length-1].c}; return q; }
function gapPack(H,ybars,tb,t,x={}){
  const yd=agg(ybars); fixBars(tb); const cb=cut(tb,t); const td=agg(cb);
  const tail=ybars.slice(36).map(b=>({...b,y:true}));
  return {days:H.days.concat([yd,td]),bars:tail.concat(cb),split:tail.length,S:H.S,R:H.R,clock:t,
    quote:{prevC:yd.c,O:cb[0].o,last:cb[cb.length-1].c},twoDay:true,...x};
}
/* today's bars after a gap (C = yesterday close) */
function tGap(C,kind,g){
  let O,k,lo,hi,vf;
  if(kind==='go'){ O=C+g; k=[[0,O],[2,O+2],[5,O+3],[12,O+5],[53,O+6]]; lo=O-1; hi=O+7; vf=i=>i<6?3:1; }
  else if(kind==='dip'){ O=C+g; const d=ri(0,1); k=[[0,O],[1,O+1],[3,C+d],[5,C+d],[8,C+2],[53,C+3]]; lo=C+d-(R()<.5?1:0); hi=O+1; vf=i=>i<2?3:i<6?0.45:1; }
  else if(kind==='fade'){ O=C+g; k=[[0,O],[1,O+1],[2,O-1],[3,C],[6,C-1],[53,C-2]]; lo=C-3; hi=O+1; vf=i=>i<4?3:1.4; }
  else if(kind==='pin'){ O=C+g; k=[[0,O],[53,O]]; lo=O; hi=O+1; vf=()=>2.4; }
  else if(kind==='tight'){ O=C+g; k=[[0,O],[1,O+1],[2,O+2],[53,O+2]]; lo=O-1; hi=O+3; vf=i=>i<3?4:1.5; }
  else if(kind==='flat'){ O=C; k=[[0,O],[53,O]]; lo=C-1; hi=C; vf=()=>0.6; }
  else if(kind==='norun'){ O=C+g; k=[[0,O],[53,O]]; lo=O-1; hi=O+1; vf=i=>i<2?2:0.5; }
  else if(kind==='down'){ O=C-g; k=[[0,O],[1,O-2],[3,O-4],[5,O-3],[53,O-4]]; lo=O-5; hi=O+1; vf=i=>i<4?3:1.2; }
  const bars=intraday(O,k,lo,hi,vf); bars[0].o=O; if(kind==='fade') force(bars,2,53,c=>Math.min(c,O-1)); return bars;
}
const force=(b,a,z,f)=>{ for(let i=a;i<=z&&i<b.length;i++){ b[i].c=f(b[i].c); } };
/* ย่อยืน / ออกข้าง วอลุ่มแห้ง — 3 ทรงย่อย + ฐาน Day 2 แบบ (สุ่ม) */
function pauseDay(k0,bv,o={}){
  const kind=o.kind||pick(['trend','trend','support']), H=history(kind,k0,bv), C=H.C;
  const v=o.v||pick(['flat','dipHold','upHold']); let b, from=0;
  if(v==='dipHold'){ const d=kind==='support'?Math.max(1,Math.min(ri(2,3),C-H.S-2)):ri(2,3), tb=ri(6,16), lv=C-d, o0=C+ri(0,1);
    b=intraday(o0,[[0,o0],[tb,lv],...swK(tb+2,52,lv,0).map(([x,y])=>[x,y+ri(0,1)]),[53,lv+ri(0,1)]],lv,o0+1,i=>i<=tb?1.4:0.45); from=tb; }
  else if(v==='upHold'){ const u=ri(2,3), tb=ri(6,16), lv=C+u;
    b=intraday(C,[[0,C],[tb,lv],...swK(tb+2,52,lv,0).map(([x,y])=>[x,y-ri(0,1)]),[53,lv]],C-1,lv,i=>i<=tb?1.4:0.45); from=tb; }
  else { const o0=C+ri(-1,1); b=intraday(o0,[[0,o0],...swK(ri(4,10),52,o0),[53,o0+ri(0,1)]],o0-1,o0+1,i=>i<6?1.1:0.5); }
  fixBars(b); scaleVol(b,minV(H.days,3)*(0.45+R()*0.15));
  const box=Math.min(...b.slice(from).map(x=>x.l));
  return {H,bars:b,stopRef:box,stopHint:v==='flat'?'ใต้กรอบออกข้าง (Low ของวัน)':'ใต้กรอบที่ย่อยืน'};
}
const yBars=(k0,bv,kind)=>{ if(kind) return SHAPES.sideways(k0,bv,kind);
  const w=pick(['pause','pause','sideways','holdStrong','reclaim']);
  return w==='pause'?pauseDay(k0,bv):SHAPES[w](k0,bv); };
const vol=(bars,H,m)=>scaleVol(bars,avgVol(H.days)*m);

const G = {

  /* เปิดโดด */
  gap(kind,t,g,yk){ return (k0,bv)=>{ const y=yBars(k0,bv,yk), C=agg(y.bars).c; const tb=tGap(C,kind,typeof g==='function'?g():g); vol(tb,y.H,kind==='flat'?0.6:1.6);

/* ---------- build question ---------- */
function legacyQ(sc){
  BAND = pick(BANDS);
  const k0 = ri(BAND.lo+42, BAND.hi-32);
  const bv = pick([4e5,9e5,1.8e6,3.5e6,7e6]);
  const q = {sc, ctx: [['อารมณ์ตลาด',MOOD()], ...sc.ctx()], note: varyNote(pick(sc.note||''))};
  if(sc.grp==='close'){
    const g = SHAPES[sc.shape](k0,bv);
    q.days = g.H.days.concat([agg(g.bars)]); q.S=g.H.S; q.bars=g.bars; q.stopRef=g.stopRef; q.stopHint=g.stopHint;
    q.clock='16:25'; q.stageName='ก่อนปิดตลาด · ตัดสินใจห่อ'; q.opts = sc.hold?HOLD_OPTS:CLOSE_OPTS;
  } else {
    const g = SHAPES[sc.y](k0,bv);
    const yday = agg(g.bars), C = yday.c;
    let gap = typeof sc.gap==='function'?sc.gap():sc.gap; q.gapKind=gap;
    let O = gap==='g'?C+ri(1,2): gap==='g2'?C+ri(2,3): gap==='y'?C : C-1;
    if(gap==='rb') O = g.H.S-1;
    let n=1, lv=[O];
    if(sc.late==='norun'){ n=ri(8,11); lv=walk([[0,O],[n-1,O]],n,1).map(x=>Math.max(O-1,Math.min(O+1,x))); }
    if(sc.late==='diff'){ const pk=ri(1,3); lv=[O]; for(let i=1;i<=pk;i++) lv.push(O+ri(0,1)); lv.push(O-1,C+1); const w=ri(1,3); for(let i=0;i<w;i++) lv.push(R()<.5?O-1:C+1); lv.push(C+ri(0,1)); n=lv.length; }
    const today=[]; let prev=O; const tb=avgVol(g.H.days)/40;
    for(let i=0;i<n;i++){ const o=i===0?O:prev,c=lv[i]; today.push({o,c,h:Math.max(o,c)+(R()<.3?1:0),l:Math.min(o,c)-(R()<.3&&i>0?1:0),v:tb*(i===0?3:1)*(0.6+R()*0.8),t:barTime(i)}); prev=c; }
    if(sc.late==='diff'){ today[1].h=Math.max(today[1].h,O+ri(1,2)); }
    const yTail = g.bars.slice(36).map(b=>({...b,y:true}));
    q.bars = yTail.concat(today); q.split=yTail.length; q.twoDay=true;
    q.days = g.H.days.concat([yday, agg(today)]); q.S=g.H.S; q.prevC=C; q.O=O;
    q.quote={prevC:C,O,last:today[today.length-1].c};
    q.clock = n===1?'10:00':barTime(n);
    q.stageName = n===1?'เปิดตลาดวันรุ่งขึ้น · ห่อมาเมื่อวาน':'วันรุ่งขึ้น · ห่อมาเมื่อวาน';
    q.ctx = [['อารมณ์ตลาด',MOOD()],['สถานะ','ถืออยู่ — ห่อมาเมื่อวาน'], ...sc.ctx()];
    q.opts = OPEN_OPTS;
  }
  return q;
}

 ['Offer บาง',['Offer บาง','ฝั่งขายบาง']],['ไม่มีไม้สาด',['ไม่มีไม้สาด','ไม่มีไม้ขายทุบลงมา']],['Offer ขวาง',['Offer ขวาง','ฝั่งขายตั้งขวางหนา']],['Bids ตื้อ',['Bids ตื้อ','Bids ไม่ขยับขึ้น']]];
function varyNote(n){ if(!n) return ''; let parts=n.split(' · ').map(x=>{ for(const [k,alts] of SYN){ if(x.includes(k)){ x=x.replace(k,pick(alts)); } } return x; });
  if(parts.length>1 && R()<.5) parts=parts.reverse(); return parts.join(' · '); }
function stageOf(t){ return t<='10:15'?'ช่วงเปิดตลาด':t<='12:30'?'ช่วงเช้า':t<'16:00'?'ช่วงบ่าย':'ชิดเย็น'; }
function chooseVariant(sc){ const vs=sc.variants, ws=vs.map(v=>{ const s=stats.by[sc.id+':'+v.v]||{seen:0,right:0}; return 1+2*(s.seen-s.right+1)/(s.seen+2); });
  let t=R()*ws.reduce((a,b)=>a+b,0); for(let i=0;i<vs.length;i++){ t-=ws[i]; if(t<=0) return vs[i]; } return vs[vs.length-1]; }
function newQ(sc,v){
  BAND = sc.index?IDX_BAND:pick(BANDS);
  const k0 = ri(BAND.lo+42, BAND.hi-32), bv = sc.index?3e7:pick([4e5,9e5,1.8e6,3.5e6,7e6]);
  const g = (v?v.gen:sc.gen)(k0,bv);
  const ctx=[];
  if(!sc.noMood) ctx.push(['อารมณ์ตลาด',pick(sc.mood||['1.5','2'])]);
  if(sc.market) ctx.push(['ตลาด',sc.market]);
  if(!sc.index||sc.hold) ctx.push(['สถานะ', sc.hold?('ถืออยู่ — '+sc.hold):'ยังไม่มีของ']);
  const q = {sc, ...g, ctx: ctx.concat(sc.ctx?sc.ctx():[]), note: varyNote(pick(sc.note||'')), opts: sc.opts || (sc.hold?HOLD3:NONE4)};
  q.stageName = stageOf(q.clock);
  if(v){ q.v=v; q.sit=v.sit; q.ans=v.ans; q.stopOn=!!v.stop; q.vname=v.name; q.note=varyNote(pick(v.note||'')); if(!v.stop){ q.stopRef=null; } }
  else { q.sit=sc.sit; q.ans=sc.ans; q.stopOn=!!sc.stop; q.vname=sc.name; }
  if(sc.index){ q.dayTitle='ดัชนี SET · TF Day'; q.m5Title='ดัชนี SET · TF 5 นาที'; }
  return q;
}
function validNew(q){
  for(const b of q.bars){ if(b.h<Math.max(b.o,b.c)||b.l>Math.min(b.o,b.c)||b.l<=2) return false; }
  for(const d of q.days){ if(d.l<=2) return false; }
  if(q.stopRef!=null && (q.stopRef-2)<=2) return false;
  return true;
}
function makeQ(sc){
  const isNew=!!(sc.gen||sc.variants), v=sc.variants?chooseVariant(sc):null;
  const mk=()=>{ if(isNew) return newQ(sc,v); const q=legacyQ(sc); q.sit=sc.sit; q.ans=sc.ans; q.stopOn=!!sc.stop; q.vname=sc.name; return q; };
  for(let t=0;t<60;t++){ const q=mk(); if(isNew?validNew(q):validQ(q)) return q; }
  return mk();
}

/* ---------- chart ---------- */
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
function candleColor(b){ return b.c>b.o?'var(--up)':b.c<b.o?'var(--down)':'var(--flat)'; }
function drawChart(svg,data,o){
  svg.innerHTML='';
  const W=360,H=+svg.getAttribute('viewBox').split(' ')[3], padR=46, padT=8, volH=H*0.2, priceH=H-volH-22;
  const n=data.length, cw=(W-padR-4)/Math.max(n,o.minN||0);
  let hi=Math.max(...data.map(d=>d.h)), lo=Math.min(...data.map(d=>d.l));
  (o.lines||[]).forEach(l=>{hi=Math.max(hi,l.k);lo=Math.min(lo,l.k);});
  hi+=1; lo-=(o.padLo||2);
  const y = k=>padT+(hi-k)/(hi-lo)*priceH;
  const g=el('g',{},svg);
  const span=hi-lo, step=Math.max(1,Math.ceil(span/5));
  for(let k=Math.ceil(lo/step)*step;k<=hi;k+=step){
    el('line',{x1:0,x2:W-padR,y1:y(k),y2:y(k),stroke:'var(--line)','stroke-width':.5},g);
    const t=el('text',{x:W-padR+4,y:y(k)+3.5,'font-size':9.5,fill:'var(--ink2)'},g); t.textContent=fmt(k);
  }
  (o.highlight||[]).forEach(i=>{ if(i>=0) el('rect',{x:4+i*cw,y:padT,width:cw,height:priceH,fill:'var(--sunk)'},g); });
  if(o.split){ const sx=4+o.split*cw-1; el('line',{x1:sx,x2:sx,y1:padT,y2:H-4,stroke:'var(--ink2)','stroke-dasharray':'2 3','stroke-width':.8},g);
    const a=el('text',{x:sx-4,y:padT+9,'font-size':9,'text-anchor':'end',fill:'var(--ink2)'},g); a.textContent='เมื่อวาน';
    const b=el('text',{x:sx+4,y:padT+9,'font-size':9,fill:'var(--ink2)'},g); b.textContent='วันนี้'; }
  if(o.zone){ el('rect',{x:0,width:W-padR,y:y(o.zone[1]+0.5),height:y(o.zone[0]-0.5)-y(o.zone[1]+0.5),fill:'var(--zone)'},g); }
  (o.lines||[]).forEach(l=>{
    el('line',{x1:0,x2:W-padR,y1:y(l.k),y2:y(l.k),stroke:l.color||'var(--accent)','stroke-width':1.2,'stroke-dasharray':l.dash||'5 3'},g);
    const t=el('text',{x:4,y:y(l.k)-3,'font-size':9.5,fill:l.color||'var(--accent)','font-weight':600},g); t.textContent=l.label;
  });
  const vmax=Math.max(...data.map(d=>d.v)), vy0=H-6;
  data.forEach((d,i)=>{
    const cx=4+i*cw+cw/2, bw=Math.max(1.5,Math.min(9,cw*0.62)), col=candleColor(d), dim=(d.y?0.45:1);
    el('line',{x1:cx,x2:cx,y1:y(d.h),y2:y(d.l),stroke:col,'stroke-width':1,opacity:dim},g);
    const top=y(Math.max(d.o,d.c)), bot=y(Math.min(d.o,d.c));
    el('rect',{x:cx-bw/2,y:top,width:bw,height:Math.max(1.2,bot-top),fill:col,opacity:dim},g);
    const vh=(d.v/vmax)*volH;
    el('rect',{x:cx-bw/2,y:vy0-vh,width:bw,height:vh,fill:col,opacity:0.35*dim+0.1},g);
  });
  if(o.times){ const set = n<=30?['10:00','10:30','11:00','11:30','12:00']:['10:00','14:30','16:00']; let last=-99;
    data.forEach((d,i)=>{ if(d.t && set.includes(d.t) && i-last>=5){ last=i; const t=el('text',{x:4+i*cw+(i===0?0:cw/2),y:H-volH-8,'font-size':9,'text-anchor':i===0?'start':'middle',fill:'var(--ink2)'},g); t.textContent=d.t; } }); }
  if(o.stopK!=null){ el('line',{x1:0,x2:W-padR,y1:y(o.stopK),y2:y(o.stopK),stroke:'var(--down)','stroke-width':1.6},g);
    el('rect',{x:W-padR,y:y(o.stopK)-7,width:padR,height:14,fill:'var(--down)',rx:3},g);
    const t=el('text',{x:W-padR+4,y:y(o.stopK)+3.5,'font-size':9.5,fill:'#fff','font-weight':700},g); t.textContent=fmt(o.stopK); }
  svg._yinv = py=>Math.round(hi-(py-padT)/priceH*(hi-lo));
  svg._range=[lo,hi];
}

/* ---------- state & stats ---------- */
let stats={by:{}}, timerOn=false, topic='all', cur=null, phase='ask', picked=null, stopK=null, tmr=null, store=null, uid=null;
const LSK='survivor-practice-close-v1';
try{ const s=JSON.parse(localStorage.getItem(LSK)||'null'); if(s&&s.by) stats=s; if(s&&s.timerOn) timerOn=true; if(s&&s.topic) topic=s.topic; }catch(e){}
function saveStats(){
  stats.timerOn=timerOn; stats.topic=topic;
  try{ localStorage.setItem(LSK,JSON.stringify(stats)); }catch(e){}
  if(store&&uid){ store.collection('data/users/'+uid).doc('survivor-close').set({by:stats.by,timerOn,topic,updatedAt:Date.now()}).catch(()=>{}); }
}
(async()=>{
  try{
    if(!window.claude||!claude.use) return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return; const id=await user.id(); if(!id) return;
    const snap=await db.collection('data/users/'+id).doc('survivor-close').get();
    store=db; uid=id;
    if(snap.exists){ const d=snap.data(); if(d&&d.by){ for(const k in d.by){ const a=stats.by[k]||{seen:0,right:0}; if((d.by[k].seen||0)>a.seen) stats.by[k]=d.by[k]; } }
      if(d&&d.timerOn) timerOn=true; renderScore(); syncTimerBtn(); }
  }catch(e){}
})();
function weightOf(sc){ const s=stats.by[sc.id]||{seen:0,right:0}; const miss=s.seen-s.right; return 0.6 + 3*(miss+1)/(s.seen+2) + (s.seen===0?0.8:0); }
let lastId=null, recentFam=[];
const famOf=s=> s.fam || (s.gen? s.gen.toString().slice(0,70) : 'L:'+(s.shape||s.y));
const poolOf=t=>SC.filter(s=>t==='all'||s.topic===t);
function chooseSc(){
  const pool=poolOf(topic).filter(s=>s.id!==lastId); const ws=pool.map(s=>weightOf(s)*(recentFam.includes(famOf(s))?0.12:1)); let t=R()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){ t-=ws[i]; if(t<=0) return pool[i]; } return pool[pool.length-1];
}
function sumOf(list){ let s=0,r=0; list.forEach(x=>{ const v=stats.by[x.id]; if(v){s+=v.seen;r+=v.right;} }); return [s,r]; }
function renderScore(){ const [s,r]=sumOf(poolOf(topic)); $('score').textContent = s? `ถูก ${Math.round(r/s*100)}% · ${s} ข้อ`:''; }
function renderTopics(){
  const t=$('topics'); t.innerHTML='';
  [{id:'all',name:'รวมทุกหมวด'}].concat(TOPICS).forEach(x=>{
    const b=document.createElement('button'); b.className='chip'; b.setAttribute('aria-pressed',topic===x.id);
    b.innerHTML=`${x.name}<small>${poolOf(x.id).length}</small>`; b.onclick=()=>{ topic=x.id; saveStats(); renderTopics(); renderScore(); show(); };
    t.appendChild(b);

}

/* ---------- render question ---------- */
const topicName=id=>(TOPICS.find(t=>t.id===id)||{}).name||'';
function show(){

  $('m5Cap').textContent = cur.twoDay?'เมื่อวานช่วงบ่าย → วันนี้':`วันนี้ 10:00–${cur.clock==='16:25'?'16:30':cur.clock}`;

function drawAll(reveal){

/* ---------- timer ---------- */
function syncTimerBtn(){ $('timerBtn').setAttribute('aria-pressed',timerOn); }
function startTimer(){
  clearTimeout(tmr); const bar=$('timer'), f=$('timerFill');
  if(!timerOn){ bar.hidden=true; return; }
  bar.hidden=false; f.style.transition='none'; f.style.width='100%'; void f.offsetWidth;
  f.style.transition='width 10s linear'; f.style.width='0%';
  tmr=setTimeout(()=>{ if(phase==='ask') grade(null,true); },10000);
}
function stopTimer(){ clearTimeout(tmr); const f=$('timerFill'); const w=getComputedStyle(f).width; f.style.transition='none'; f.style.width=w; }

/* ---------- answering ---------- */
const needStop = k=> cur.stopOn && cur.stopRef!=null && cur.ans.includes(k) && (k==='wrap'||k==='buy');
function answer(k){
  if(phase!=='ask') return;
  stopTimer(); picked=k;
  [...$('answers').children].forEach(b=>{ b.disabled=true; if(b.dataset.k===k) b.classList.add('pick'); });
  if(needStop(k)){ phase='stop'; $('stopbar').classList.add('on'); $('m5Box').classList.add('tapping'); $('stVal').textContent='แตะกราฟ'; $('stGo').disabled=true; if(!EMBED) $('m5Box').scrollIntoView({block:'center',behavior:'smooth'}); return; }
  grade(k,false);
}
$('m5Svg').addEventListener('pointerdown',e=>{
  if(phase!=='stop') return;
  const svg=$('m5Svg'), r=svg.getBoundingClientRect(), vb=svg.viewBox.baseVal;
  setStop(svg._yinv((e.clientY-r.top)/r.height*vb.height));
});
function setStop(k){ const [lo,hi]=$('m5Svg')._range; stopK=Math.max(lo,Math.min(hi,k)); $('stVal').textContent=fmt(stopK); $('stGo').disabled=false; drawAll(); }
$('stDown').onclick=()=>{ if(phase==='stop'&&stopK!=null) setStop(stopK-1); };
$('stUp').onclick=()=>{ if(phase==='stop'&&stopK!=null) setStop(stopK+1); };
$('stGo').onclick=()=>{ if(phase==='stop'&&stopK!=null){ $('stopbar').classList.remove('on'); $('m5Box').classList.remove('tapping'); grade(picked,false); } };

function grade(k,timeout){
  phase='done';
  const sc=cur.sc, ANS=cur.ans, okAct = ANS.includes(k);
  let stopOk=null;
  if(okAct && stopK!=null && needStop(k)){ const d=cur.stopRef-stopK; stopOk = d>=1&&d<=2; }
  const ok = okAct && stopOk!==false;
  const s=stats.by[sc.id]||{seen:0,right:0}; s.seen++; if(ok) s.right++; stats.by[sc.id]=s;
  if(cur.v){ const vk=sc.id+':'+cur.v.v, sv=stats.by[vk]||{seen:0,right:0}; sv.seen++; if(ok) sv.right++; stats.by[vk]=sv; }
  saveStats(); renderScore();
  [...$('answers').children].forEach(b=>{ b.disabled=true; if(ANS.includes(b.dataset.k)) b.classList.add('right'); else if(b.dataset.k===k) b.classList.add('wrong'); });
  drawAll(true);
  const lab=Object.fromEntries(cur.opts);
  const st=SITS[cur.sit], also=(!cur.v&&sc.also!=null)?SITS[sc.also]:null;
  const pending = x=>x && /รอเข้าตำรา/.test(x.textbook_section);
  let sub = (timeout?'หมดเวลา 10 วินาที':`คุณเลือก: ${lab[k]}`) + ` · ที่ถูก: ${ANS.map(a=>lab[a]).join(' หรือ ')}`;
  let stopTxt='';
  if(cur.stopOn && cur.stopRef!=null){
    const z=`${fmt(cur.stopRef-2)}–${fmt(cur.stopRef-1)}`;
    if(stopOk===true) stopTxt=`<dt>Stop</dt><dd>${fmt(stopK)} ถูกต้อง — ${cur.stopHint} 1–2 ช่อง (${z})</dd>`;
    else if(stopOk===false) stopTxt=`<dt>Stop</dt><dd>${fmt(stopK)} ยังไม่ตรง — ควรอยู่${cur.stopHint} 1–2 ช่อง = ${z} (แถบสีบนกราฟ 5 นาที)</dd>`;
    else stopTxt=`<dt>Stop ถ้าเข้า</dt><dd>${cur.stopHint} 1–2 ช่อง = ${z}</dd>`;
  }
  const verdict = ok?'ถูก':(okAct&&stopOk===false?'ตัดสินใจถูก แต่ Stop ผิดที่':'ยังไม่ถูก');
  $('fb').className='fb on '+(ok?'ok':'no');
  $('fb').innerHTML = `<p class="verdict">${verdict}</p><p class="sub">${sub}</p>
   <dl><dt>ภาพนี้คือ</dt><dd>${st.setup}${st.setup.includes(cur.vname)?'':` <span class="dim">(${cur.vname})</span>`}</dd>
   <dt>สภาวะในตำรา</dt><dd>${st.market} · ${st.holding}</dd>
   <dt>ทำอะไร</dt><dd>${st.action}</dd>
   ${also?`<dt>เทียบ ${also.textbook_section} (${also.holding})</dt><dd>${also.action}</dd>`:''}
   ${stopTxt}
   <dt>หลักคิด</dt><dd><blockquote>“${st.principle}”</blockquote></dd>
   <dt>ตำรา</dt><dd>หัวข้อ ${st.textbook_section}${also?' · '+also.textbook_section:''}</dd></dl>
   ${pending(st)||pending(also)?'<span class="tag">ยังไม่อยู่ในตำรา — มาจากไฟล์เสียงคลาส</span>':''}
   <button class="next" id="nextBtn">ข้อถัดไป</button>`;
  $('nextBtn').onclick=show;
  if(!EMBED) $('fb').scrollIntoView({block:'nearest',behavior:'smooth'});
}

$('closeDlg').onclick=()=>$('statsDlg').close();
$('resetBtn').onclick=()=>{ if(confirm('ล้างสถิติทั้งหมด?')){ stats={by:{}}; saveStats(); renderScore(); renderStats(); } };
$('timerBtn').onclick=()=>{ timerOn=!timerOn; syncTimerBtn(); saveStats(); if(phase==='ask') startTimer(); };

/* ---------- embed mode: ?embed=1 inside survivor.html (iframe) ---------- */
const EMBED = new URLSearchParams(location.search).has('embed');
if(EMBED){
  const ps=new URLSearchParams(location.search);
  document.documentElement.classList.add('embed');
  document.documentElement.setAttribute('data-theme', ps.get('theme')||'light');
  const sendH=()=>{ try{ parent.postMessage({type:'survivor-practice-height',h:document.documentElement.scrollHeight},'*'); }catch(e){} };
  try{ new ResizeObserver(sendH).observe(document.body); }catch(e){}
  window.addEventListener('load',sendH); setTimeout(sendH,300);
}
if(topic!=='all' && !TOPICS.find(t=>t.id===topic)) topic='all';
syncTimerBtn(); renderTopics(); renderScore(); show();

</script>
</body>
