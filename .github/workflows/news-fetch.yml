name: Fetch news snapshot

# Runs independently of the local update_stockdesk.bat pipeline so news
# snapshots keep updating even when that machine is off. Hourly (not every
# 30 min) to stay comfortably inside the private-repo free Actions minutes
# budget — tighten the cron below if you check your usage and have headroom.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch feeds and write daily snapshots
        run: python scripts/save_news.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/history
          if git diff --cached --quiet; then
            echo "No new news items — nothing to commit"
            exit 0
          fi
          git commit -m "Automated news snapshot update"
          git pull --rebase
          git push
