name: Fetch news snapshot

# Runs independently of the local update_stockdesk.bat pipeline so news
# snapshots keep updating even when that machine is off. Hourly (not every
# 30 min) to stay comfortably inside the private-repo free Actions minutes
# budget — tighten the cron below if you check your usage and have headroom.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fetch feeds and write daily snapshots
        run: python scripts/save_news.py

      - name: Build news flags (scan-page badges)
        # Rule-based flags from the SET news just saved + earnings_feed + XD/XR calendar.
        # Non-fatal: a failure keeps the previous news_flags.json and the news commit still goes out.
        run: python scripts/build_news_flags.py || echo "build_news_flags failed"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/safe_push.py --repo . --message "Automated news snapshot update" --add public/data/history public/data/news_flags.json
